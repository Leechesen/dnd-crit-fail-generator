<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 48px;
      overflow: hidden;
    }

    #overlay-card {
      background: #1e1e1e;
      border: 2px solid #ff9800;
      border-radius: 14px;
      padding: 20px 28px;
      max-width: 600px;
      width: 90%;
      box-shadow:
        0 0 18px rgba(255, 152, 0, 0.45),
        0 4px 24px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transform: translateY(20px);
      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
      pointer-events: none;
    }

    #overlay-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #overlay-card.hidden {
      opacity: 0;
      transform: translateY(20px);
    }

    .overlay-player {
      font-size: 13px;
      font-weight: bold;
      color: #ff9800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .overlay-effect {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .overlay-roleplay {
      font-size: 14px;
      color: #cccccc;
      font-style: italic;
      line-height: 1.5;
    }

    .overlay-divider {
      height: 1px;
      background: rgba(255, 152, 0, 0.3);
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <div id="overlay-card">
    <div class="overlay-player" id="overlay-player"></div>
    <div class="overlay-effect" id="overlay-effect"></div>
    <div class="overlay-divider"></div>
    <div class="overlay-roleplay" id="overlay-roleplay"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyReplaceWithYours",
      authDomain: "your-app.firebaseapp.com",
      databaseURL: "https://your-app-default-rtdb.firebaseio.com",
      projectId: "your-app",
      storageBucket: "your-app.appspot.com",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:abcdef1234567890"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const params = new URLSearchParams(window.location.search);
    const room = params.get("room");

    if (!room) {
      console.warn("No room param provided.");
    } else {
      const card = document.getElementById("overlay-card");
      const playerEl = document.getElementById("overlay-player");
      const effectEl = document.getElementById("overlay-effect");
      const roleplayEl = document.getElementById("overlay-roleplay");

      let hideTimer = null;

      function showCard(data) {
        playerEl.textContent = data.player || "";
        effectEl.textContent = data.effect || "";
        roleplayEl.textContent = data.roleplay || "";

        card.classList.remove("hidden");
        void card.offsetWidth;
        card.classList.add("visible");

        if (hideTimer) {
          clearTimeout(hideTimer);
        }

        hideTimer = setTimeout(() => {
          hideCard();
        }, 60000);
      }

      function hideCard() {
        card.classList.remove("visible");
        card.classList.add("hidden");
        if (hideTimer) {
          clearTimeout(hideTimer);
          hideTimer = null;
        }
      }

      const overlayRef = ref(db, `rooms/${room}/lastOverlay`);

      onValue(overlayRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.player && data.effect) {
          showCard(data);
        }
      });
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KritFailer Overlay</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  #no-room {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vmin;
    color: #ddd9ed;
    font-size: clamp(20px, 3.5vmin, 80px);
    line-height: 1.4;
    text-align: center;
    background: transparent;
  }

  #overlay-wrap {
    position: fixed;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform-origin: center;
  }

  #overlay-wrap.visible {
    opacity: 1;
    transform: scale(1);
  }

  #overlay-wrap.hidden-out {
    opacity: 0;
    transform: scale(0.985);
  }

  .panel {
    position: relative;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto auto;
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: clamp(20px, 4.5vmin, 110px);
    background: linear-gradient(160deg, #0d0d18 0%, #12101e 60%, #0a0a14 100%);
    border: clamp(2px, 0.16vmin, 4px) solid #4a4a6a;
    color: #aaaacc;
    --sev-color: #aaaacc;
    --sev-glow: rgba(170, 170, 204, 0.2);
    overflow: hidden;
  }

  .panel::before,
  .panel::after {
    content: '';
    position: absolute;
    width: clamp(18px, 4vmin, 90px);
    height: clamp(18px, 4vmin, 90px);
    border-color: currentColor;
    border-style: solid;
    opacity: 0.35;
  }

  .panel::before { top: 1.2vmin; left: 1.2vmin; border-width: 0.15vmin 0 0 0.15vmin; }
  .panel::after { bottom: 1.2vmin; right: 1.2vmin; border-width: 0 0.15vmin 0.15vmin 0; }

  .panel-glow {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: clamp(3px, 0.35vmin, 9px);
    background: var(--sev-color);
    opacity: 0.75;
    box-shadow: 0 0 2vmin 0.4vmin var(--sev-glow);
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 2vmin;
    min-width: 0;
    margin-bottom: 3vmin;
  }

  .title-icon {
    flex: 0 0 auto;
    font-size: clamp(28px, 8vmin, 180px);
    line-height: 1;
    filter: drop-shadow(0 0 0.6vmin var(--sev-color));
  }

  .title-icon svg { display: block; width: 1em; height: 1em; }

  .title-text {
    flex: 1 1 0;
    min-width: 0;
    font-size: clamp(28px, 8.6vmin, 200px);
    font-weight: 900;
    letter-spacing: clamp(1px, 0.4vmin, 10px);
    text-transform: uppercase;
    color: var(--sev-color);
    text-shadow: 0 0 1vmin var(--sev-glow), 0 2px 4px rgba(0, 0, 0, 0.8);
    line-height: 1.05;
    overflow-wrap: anywhere;
  }

  .divider {
    height: clamp(1px, 0.15vmin, 4px);
    background: linear-gradient(90deg, var(--sev-color), transparent);
    opacity: 0.4;
  }

  .effect-area {
    display: flex;
    align-items: center;
    min-height: 0;
    min-width: 0;
    margin: 3vmin 0;
  }

  .effect-text {
    width: 100%;
    min-width: 0;
    padding-left: 2.2vmin;
    border-left: clamp(2px, 0.25vmin, 6px) solid var(--sev-color);
    font-size: clamp(24px, 6.7vmin, 150px);
    font-weight: 600;
    color: #f0e8d8;
    line-height: 1.24;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .player-row {
    display: flex;
    align-items: baseline;
    gap: 1.4vmin;
    min-width: 0;
  }

  .player-label {
    flex: 0 0 auto;
    font-size: clamp(16px, 2.6vmin, 60px);
    letter-spacing: 0.15vmin;
    text-transform: uppercase;
    color: #b5aec5;
    font-weight: 600;
  }

  .player-name {
    flex: 0 1 auto;
    min-width: 0;
    font-size: clamp(20px, 3.4vmin, 80px);
    color: #e2daee;
    font-weight: 600;
    overflow-wrap: anywhere;
  }

  .timer-bar-wrap {
    margin-top: 2.5vmin;
    height: clamp(4px, 0.55vmin, 14px);
    background: rgba(255, 255, 255, 0.08);
    border-radius: 1vmin;
    overflow: hidden;
  }

  .timer-bar {
    height: 100%;
    width: 100%;
    background: var(--sev-color);
    opacity: 0.8;
    border-radius: 1vmin;
    transform-origin: left center;
    transition: none;
  }

  .timer-bar.running {
    transition: transform linear;
    transform: scaleX(0);
  }
</style>
</head>
<body>

<div id="no-room" style="display:none;">Není vybraná místnost.</div>

<div id="overlay-wrap" aria-live="polite">
  <div class="panel sev-other" id="panel">
    <div class="panel-glow" id="panelGlow"></div>
    <div class="title-row">
      <div class="title-icon" id="titleIcon" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 47v12h28V47c8-4 13-12 13-21C59 12 47 3 32 3S5 12 5 26c0 9 5 17 13 21Z"/>
          <circle cx="22" cy="28" r="6"/>
          <circle cx="42" cy="28" r="6"/>
          <path d="m28 43 4-6 4 6ZM26 50v9m12-9v9"/>
        </svg>
      </div>
      <div class="title-text" id="titleText">CRIT FAIL</div>
    </div>
    <div class="divider"></div>
    <div class="effect-area" id="effectArea">
      <div class="effect-text" id="effectText"></div>
    </div>
    <div class="player-row">
      <span class="player-label">Hráč:</span>
      <span class="player-name" id="playerName"></span>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timerBar"></div>
    </div>
  </div>
</div>

<script type="module">
import { connectFirebase, ref, onValue } from "./firebase-client.mjs";

const DISPLAY_MS = 20_000;

const wrap = document.getElementById("overlay-wrap");
const titleText = document.getElementById("titleText");
const effectArea = document.getElementById("effectArea");
const effectText = document.getElementById("effectText");
const playerName = document.getElementById("playerName");
const timerBar = document.getElementById("timerBar");
const noRoom = document.getElementById("no-room");

// Keep native browser text sharp at any resolution, fitting long results in full.
const fitText = (element, availableHeight) => {
  const maximum = parseFloat(getComputedStyle(element).fontSize);
  const fits = () => element.scrollHeight <= availableHeight && element.scrollWidth <= element.clientWidth;
  if (fits()) return;
  let low = Math.min(12, maximum);
  let high = maximum;
  for (let step = 0; step < 12; step++) {
    const size = (low + high) / 2;
    element.style.fontSize = `${size}px`;
    if (fits()) low = size;
    else high = size;
  }
  element.style.fontSize = `${low}px`;
};

const fitOverlayText = () => {
  for (const element of [titleText, effectText, playerName]) element.style.removeProperty("font-size");
  fitText(titleText, window.innerHeight * 0.22);
  fitText(playerName, window.innerHeight * 0.12);
  fitText(effectText, effectArea.clientHeight);
};

let resizeFrame = null;
window.addEventListener("resize", () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(fitOverlayText);
});
document.fonts.ready.then(fitOverlayText);

const params = new URLSearchParams(window.location.search);
const ROOM = params.get("room");

if (!ROOM) {
  noRoom.style.display = "flex";
} else {
  try {
    const { db } = await connectFirebase();
    let hideTimer = null;
    let lastEventId = null;

    const showOverlay = (data, remainingMs = DISPLAY_MS) => {
      titleText.textContent = data.title || "CRIT FAIL";
      effectText.textContent = data.effect || "";
      playerName.textContent = data.player || "";
      fitOverlayText();

      timerBar.classList.remove("running");
      timerBar.style.transition = "none";
      timerBar.style.transform = "scaleX(1)";
      wrap.classList.remove("hidden-out");
      wrap.classList.add("visible");

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          timerBar.style.transition = `transform ${remainingMs}ms linear`;
          timerBar.style.removeProperty("transform");
          timerBar.classList.add("running");
        });
      });

      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideOverlay, remainingMs);
    };

    const hideOverlay = () => {
      wrap.classList.remove("visible");
      wrap.classList.add("hidden-out");
      timerBar.classList.remove("running");
    };

    const overlayRef = ref(db, `roomsV2/${ROOM}/overlay`);
    onValue(overlayRef, snap => {
      if (!snap.exists()) { hideOverlay(); return; }
      const data = snap.val();
      if (!data) return;
      if (!data.id || data.id === lastEventId) return;
      lastEventId = data.id;
      const remaining = DISPLAY_MS - Math.max(0, Date.now() - (data.ts || 0));
      if (remaining <= 0) return;
      showOverlay(data, remaining);
    });
  } catch (error) {
    console.error(error);
    noRoom.textContent = "Overlay se nepodařilo připojit. Ověř nastavení Firebase.";
    noRoom.style.display = "flex";
  }
}
</script>
</body>
</html>

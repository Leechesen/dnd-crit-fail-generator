<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KritFailer Overlay</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', Georgia, serif;
  }

  #no-room {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.5);
    font-size: 1.1rem;
    font-style: italic;
    background: transparent;
  }

  #overlay-wrap {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: min(720px, 92vw);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform-origin: bottom center;
  }

  #overlay-wrap.visible {
    opacity: 1;
    transform: translateX(-50%) scaleY(1);
  }

  #overlay-wrap.hidden-out {
    opacity: 0;
    transform: translateX(-50%) scaleY(0.97);
  }

  /* ── PANEL ── */
  .panel {
    position: relative;
    background: linear-gradient(160deg, #0d0d18 0%, #12101e 60%, #0a0a14 100%);
    border: 2px solid #444466;
    border-radius: 6px;
    padding: 20px 26px 18px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 8px 40px rgba(0,0,0,0.85),
      0 2px 8px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  /* corner ornaments */
  .panel::before,
  .panel::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    border-color: currentColor;
    border-style: solid;
    opacity: 0.35;
  }
  .panel::before { top: 6px;    left: 6px;    border-width: 2px 0 0 2px; }
  .panel::after  { bottom: 6px; right: 6px;   border-width: 0 2px 2px 0; }

  /* severity colour theming */
  .panel.sev-lehky  { border-color: #888899; --sev-color: #aaaacc; --sev-glow: rgba(170,170,200,0.18); }
  .panel.sev-stredni{ border-color: #c07010; --sev-color: #e9a020; --sev-glow: rgba(233,160,32,0.22); }
  .panel.sev-tezky  { border-color: #9b1e1e; --sev-color: #e94560; --sev-glow: rgba(233,69,96,0.25); }
  .panel.sev-other  { border-color: #4a4a6a; --sev-color: #8888bb; --sev-glow: rgba(136,136,187,0.15); }

  .panel.sev-lehky::before,
  .panel.sev-lehky::after  { color: #aaaacc; }
  .panel.sev-stredni::before,
  .panel.sev-stredni::after{ color: #e9a020; }
  .panel.sev-tezky::before,
  .panel.sev-tezky::after  { color: #e94560; }
  .panel.sev-other::before,
  .panel.sev-other::after  { color: #8888bb; }

  /* inner glow strip */
  .panel-glow {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--sev-color, #888899);
    opacity: 0.75;
    border-radius: 6px 6px 0 0;
    box-shadow: 0 0 14px 3px var(--sev-glow, rgba(136,136,153,0.2));
  }

  /* ── TITLE ── */
  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .title-icon {
    font-size: 1.7rem;
    line-height: 1;
    filter: drop-shadow(0 0 6px var(--sev-color, #aaaacc));
  }

  .title-text {
    font-size: 1.75rem;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--sev-color, #ccccdd);
    text-shadow:
      0 0 12px var(--sev-glow, rgba(200,200,220,0.4)),
      0 2px 4px rgba(0,0,0,0.8);
    line-height: 1;
  }

  .severity-badge {
    margin-left: auto;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--sev-color, #aaaacc);
    border: 1px solid var(--sev-color, #aaaacc);
    border-radius: 3px;
    padding: 3px 8px;
    opacity: 0.8;
    white-space: nowrap;
  }

  /* ── DIVIDER ── */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--sev-color, #666688) 30%, var(--sev-color, #666688) 70%, transparent);
    opacity: 0.35;
    margin-bottom: 13px;
  }

  /* ── EFFECT ── */
  .effect-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: #f0e8d8;
    line-height: 1.5;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 2px solid var(--sev-color, #888899);
  }

  /* ── PLAYER ── */
  .player-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 4px;
  }

  .player-label {
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(180,170,200,0.5);
    font-weight: 600;
  }

  .player-name {
    font-size: 0.82rem;
    color: rgba(220,210,240,0.75);
    font-weight: 600;
    font-style: italic;
  }

  /* ── TIMER BAR ── */
  .timer-bar-wrap {
    margin-top: 13px;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .timer-bar {
    height: 100%;
    width: 100%;
    background: var(--sev-color, #888899);
    opacity: 0.5;
    border-radius: 2px;
    transform-origin: left center;
    transition: none;
  }

  .timer-bar.running {
    transition: transform linear;
    transform: scaleX(0);
  }
</style>
</head>
<body>

<div id="no-room" style="display:none;">No room selected</div>

<div id="overlay-wrap" aria-live="polite">
  <div class="panel" id="panel">
    <div class="panel-glow" id="panelGlow"></div>
    <div class="title-row">
      <div class="title-icon" id="titleIcon">💀</div>
      <div class="title-text"  id="titleText">CRIT FAIL</div>
      <div class="severity-badge" id="sevBadge"></div>
    </div>
    <div class="divider"></div>
    <div class="effect-text" id="effectText"></div>
    <div class="player-row">
      <span class="player-label">Hráč:</span>
      <span class="player-name" id="playerName"></span>
    </div>
    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timerBar"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ── Firebase config ───────────────────────────────────────────────────────────
// Replace with your actual Firebase project config
const firebaseConfig = {
  apiKey:      "AIzaSyBsomething",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
};

// ── Constants ─────────────────────────────────────────────────────────────────
const DISPLAY_MS  = 60_000;   // how long overlay stays visible
const FADE_MS     = 600;      // must match CSS transition duration

// ── DOM refs ──────────────────────────────────────────────────────────────────
const wrap       = document.getElementById("overlay-wrap");
const panel      = document.getElementById("panel");
const titleIcon  = document.getElementById("titleIcon");
const titleText  = document.getElementById("titleText");
const sevBadge   = document.getElementById("sevBadge");
const effectText = document.getElementById("effectText");
const playerName = document.getElementById("playerName");
const timerBar   = document.getElementById("timerBar");
const noRoom     = document.getElementById("no-room");

// ── Room from URL ─────────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const ROOM   = params.get("room");

if (!ROOM) {
  noRoom.style.display = "flex";
} else {
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  let hideTimer    = null;
  let lastTs       = null;

  // ── Severity → CSS class + icon ─────────────────────────────────────────────
  const sevClass = sev => {
    if (!sev) return "sev-other";
    const s = sev.toLowerCase();
    if (s === "lehký"   || s === "lehky")   return "sev-lehky";
    if (s === "střední" || s === "stredni") return "sev-stredni";
    if (s === "těžký"   || s === "tezky")   return "sev-tezky";
    return "sev-other";
  };

  const sevIcon = sev => {
    if (!sev) return "💀";
    const s = sev.toLowerCase();
    if (s === "lehký"   || s === "lehky")   return "😬";
    if (s === "střední" || s === "stredni") return "💥";
    if (s === "těžký"   || s === "tezky")   return "☠️";
    return "💀";
  };

  // ── Show overlay ─────────────────────────────────────────────────────────────
  const showOverlay = data => {
    // Populate content
    titleText.textContent  = data.title    || "CRIT FAIL";
    effectText.textContent = data.effect   || "";
    playerName.textContent = data.player   || "";
    sevBadge.textContent   = data.severity || "";
    titleIcon.textContent  = sevIcon(data.severity);

    // Severity styling
    panel.className = "panel " + sevClass(data.severity);

    // Reset timer bar
    timerBar.classList.remove("running");
    timerBar.style.transition = "none";
    timerBar.style.transform  = "scaleX(1)";

    // Show
    wrap.classList.remove("hidden-out");
    wrap.classList.add("visible");

    // Start shrink bar after a tick (allow repaint)
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        timerBar.style.transition = `transform ${DISPLAY_MS}ms linear`;
        timerBar.classList.add("running");
      });
    });

    // Clear any existing hide timer
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideOverlay, DISPLAY_MS);
  };

  // ── Hide overlay ─────────────────────────────────────────────────────────────
  const hideOverlay = () => {
    wrap.classList.remove("visible");
    wrap.classList.add("hidden-out");
    timerBar.classList.remove("running");
  };

  // ── Firebase listener ────────────────────────────────────────────────────────
  const overlayRef = ref(db, `rooms/${ROOM}/overlay`);

  onValue(overlayRef, snap => {
    if (!snap.exists()) return;

    const data = snap.val();
    if (!data) return;

    // Ignore if same timestamp (re-connect / page reload)
    if (data.ts && data.ts === lastTs) return;
    lastTs = data.ts || null;

    showOverlay(data);
  });
}
</script>
</body>
</html>

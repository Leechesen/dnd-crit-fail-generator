<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KritFailer</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

h1 {
  color: #ff9800;
}

button {
  padding: 10px 14px;
  margin: 4px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  background: #222;
  color: white;
}

button:hover {
  background: #444;
}

.card {
  margin-top: 10px;
  font-size: 16px;
  white-space: pre-line;
  padding: 12px;
  border-radius: 10px;
  background: #1a1a1a;
}

.logout {
  background: #aa3333;
}

.player-btn {
  background: #2a3a5a;
}

.sev-active {
  background: #ff9800 !important;
}
</style>
</head>

<body>

<h1>🎲 KritFailer</h1>

<div id="setup">
  <input id="name" placeholder="Tvoje jméno">
  <input id="room" placeholder="Room code">
  <br>
  <button onclick="joinDM()">Jsem DM</button>
  <button onclick="joinPlayer()">Jsem hráč</button>
</div>

<div id="dmPanel" style="display:none;">
  <h2>👑 DM Panel</h2>

  <button class="logout" onclick="logout()">🚪 Logout</button>

  <div id="players"></div>
  <div id="severity"></div>
  <div id="buttons"></div>
</div>

<div id="playerView" style="display:none;">
  <h2>🎭 Tvoje událost</h2>

  <button class="logout" onclick="logout()">🚪 Logout</button>

  <div class="card" id="playerResult">Čekám na DM...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  authDomain: "ktit-fail-generator.firebaseapp.com",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ktit-fail-generator",
  storageBucket: "ktit-fail-generator.firebasestorage.app",
  messagingSenderId: "1077220217346",
  appId: "1:1077220217346:web:56378b0ed6d52774f88d1b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =========================
// STATE
// =========================

let critData = {};
let room = "";
let myId = "";
let currentSeverity = "Lehký";
let lastState = null;
let activeContainer = null;
let currentResult = "";
let currentPlayers = {};

// =========================
// LOAD JSON
// =========================

fetch("crit_fails.json")
  .then(res => res.json())
  .then(data => {
    critData = data;
    buildSeverity();
    buildButtons();
  });

// =========================
// JOIN
// =========================

window.joinDM = function() {
  room = document.getElementById("room").value;

  localStorage.setItem("role", "dm");
  localStorage.setItem("room", room);

  document.getElementById("setup").style.display = "none";
  document.getElementById("dmPanel").style.display = "block";

  listenPlayers();
}

window.joinPlayer = function() {
  room = document.getElementById("room").value;
  const name = document.getElementById("name").value;

  myId = name + "_" + Math.floor(Math.random()*1000);

  localStorage.setItem("role", "player");
  localStorage.setItem("room", room);
  localStorage.setItem("name", name);
  localStorage.setItem("id", myId);

  const playerRef = ref(db, 'rooms/' + room + '/players/' + myId);

  set(playerRef, { name: name });

  // 🔥 AUTO REMOVE PŘI ODPOJENÍ
  onDisconnect(playerRef).remove();

  document.getElementById("setup").style.display = "none";
  document.getElementById("playerView").style.display = "block";

  listenPlayerMessages();
}

// =========================
// AUTO LOGIN
// =========================

document.addEventListener("DOMContentLoaded", () => {
  const role = localStorage.getItem("role");
  const savedRoom = localStorage.getItem("room");

  if (!role || !savedRoom) return;

  room = savedRoom;

  if (role === "dm") {
    document.getElementById("setup").style.display = "none";
    document.getElementById("dmPanel").style.display = "block";
    listenPlayers();
  }

  if (role === "player") {
    myId = localStorage.getItem("id");
    document.getElementById("setup").style.display = "none";
    document.getElementById("playerView").style.display = "block";
    listenPlayerMessages();
  }
});

// =========================
// PLAYER MESSAGES
// =========================

function listenPlayerMessages() {
  onValue(ref(db, 'rooms/' + room + '/messages/' + myId), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      document.getElementById("playerResult").innerText = data.value;
    }
  });
}

// =========================
// LOGOUT
// =========================

window.logout = function() {
  localStorage.clear();
  location.reload();
}

// =========================
// PLAYERS (LIVE LIST)
// =========================

function listenPlayers() {
  onValue(ref(db, 'rooms/' + room + '/players'), (snapshot) => {
    currentPlayers = snapshot.val() || {};

    const container = document.getElementById("players");
    container.innerHTML = "<h3>👥 Připojeni:</h3>";

    Object.values(currentPlayers).forEach(p => {
      const div = document.createElement("div");
      div.innerText = "• " + p.name;
      container.appendChild(div);
    });
  });
}

// =========================
// SEVERITY
// =========================

function buildSeverity() {
  const container = document.getElementById("severity");
  container.innerHTML = "<h3>🎚️ Obtížnost</h3>";

  ["Lehký", "Střední", "Těžký", "Sranda"].forEach(sev => {
    const btn = document.createElement("button");

    btn.innerText = sev;

    if (sev === currentSeverity) {
      btn.classList.add("sev-active");
    }

    btn.onclick = () => {
      currentSeverity = sev;
      buildSeverity();
    };

    container.appendChild(btn);
  });
}

// =========================
// BUTTONS
// =========================

function buildButtons() {
  const container = document.getElementById("buttons");
  container.innerHTML = "";

  if (critData["Útok"]) {
    const section = document.createElement("div");
    section.innerHTML = "<h3>⚔️ Útok</h3>";

    Object.keys(critData["Útok"]).forEach(type => {
      const btn = document.createElement("button");
      btn.innerText = type;
      btn.onclick = (e) => generate("Útok", type, e.target);
      section.appendChild(btn);
    });

    container.appendChild(section);
  }

  if (critData["Obrana"]) {
    const section = document.createElement("div");
    section.innerHTML = "<h3>🛡️ Obrana</h3>";

    const btn = document.createElement("button");
    btn.innerText = "Obrana";
    btn.onclick = (e) => generate("Obrana", null, e.target);

    section.appendChild(btn);
    container.appendChild(section);
  }

  if (critData["Skill"]) {
    const section = document.createElement("div");
    section.innerHTML = "<h3>🎲 Skilly</h3>";

    Object.keys(critData["Skill"]).forEach(attr => {
      const attrDiv = document.createElement("div");
      attrDiv.innerHTML = `<b>${attr}</b><br>`;

      Object.keys(critData["Skill"][attr]).forEach(skill => {
        const btn = document.createElement("button");
        btn.innerText = skill;
        btn.onclick = (e) => generate("Skill", {attr, skill}, e.target);
        attrDiv.appendChild(btn);
      });

      section.appendChild(attrDiv);
    });

    container.appendChild(section);
  }
}

// =========================
// GENERATE
// =========================

window.generate = function(type, sub, buttonElement) {

  let pool;

  if (type === "Útok") pool = critData[type][sub][currentSeverity];
  else if (type === "Obrana") pool = critData[type][currentSeverity];
  else if (type === "Skill") pool = critData[type][sub.attr][sub.skill][currentSeverity];

  if (!pool) return;

  const random = pool[Math.floor(Math.random() * pool.length)];

  lastState = { pool, type, sub, severity: currentSeverity };

  let label = type === "Skill"
    ? `${sub.attr} → ${sub.skill}`
    : sub || "";

  currentResult =
    `🎯 ${type} → ${label} (${currentSeverity})\n\n` +
    `💥 ${random.effect}\n\n` +
    `🎭 ${(random.roleplay || []).join(" ")}`;

  if (activeContainer) activeContainer.remove();

  let playersHTML = "";
  Object.entries(currentPlayers).forEach(([id, p]) => {
    playersHTML += `<button class="player-btn" onclick="sendTo('${id}')">${p.name}</button>`;
  });

  const box = document.createElement("div");
  box.className = "card";

  box.innerHTML = `
    ${currentResult}
    <br><br>
    <button onclick="reroll()">🔄 Generuj znovu</button>
    <br><br>
    ${playersHTML}
  `;

  buttonElement.parentNode.insertBefore(box, buttonElement.nextSibling);
  activeContainer = box;
}

// =========================
// REROLL
// =========================

window.reroll = function() {
  if (!lastState) return;

  const random = lastState.pool[Math.floor(Math.random() * lastState.pool.length)];

  let label = lastState.type === "Skill"
    ? `${lastState.sub.attr} → ${lastState.sub.skill}`
    : lastState.sub || "";

  currentResult =
    `🎯 ${lastState.type} → ${label} (${lastState.severity})\n\n` +
    `💥 ${random.effect}\n\n` +
    `🎭 ${(random.roleplay || []).join(" ")}`;

  activeContainer.innerHTML = `
    ${currentResult}
    <br><br>
    <button onclick="reroll()">🔄 Generuj znovu</button>
    <br><br>
    ${Object.entries(currentPlayers).map(([id, p]) =>
      `<button class="player-btn" onclick="sendTo('${id}')">${p.name}</button>`
    ).join("")}
  `;
}

// =========================
// SEND
// =========================

window.sendTo = function(playerId) {
  set(ref(db, 'rooms/' + room + '/messages/' + playerId), {
    value: currentResult,
    time: Date.now()
  });
}

</script>

</body>
</html>

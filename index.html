<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>KritFailer PRO</title>

<style>
body { font-family: Arial; margin:0; background:#fff; }
header { display:flex; justify-content:space-between; padding:10px; background:#eee; }
button { margin:4px; padding:10px; border:none; border-radius:8px; cursor:pointer; }
.primary{ background:orange; color:white;}
.danger{ background:red; color:white;}
.card{ background:#f5f5f5; padding:10px; border-radius:10px; margin-top:10px;}
.hidden{ display:none;}
</style>
</head>

<body>

<header>
<div>🎲 KritFailer</div>
<div id="playersTop"></div>
<div id="topBtns"></div>
</header>

<div id="setup">
<input id="name" placeholder="Jméno">
<input id="room" placeholder="Místnost">
<button onclick="createRoom()">Vytvořit</button>
<div id="rooms"></div>
</div>

<div id="app" class="hidden">

<h3 id="roomTitle"></h3>

<div id="dmPanel" class="hidden">

<h3>Typ</h3>
<button onclick="setType('attack')">⚔️</button>
<button onclick="setType('defense')">🛡️</button>
<button onclick="setType('skill')">🎯</button>

<h3>Attack</h3>
<button onclick="setAttack('Melee')">Melee</button>
<button onclick="setAttack('Ranged')">Ranged</button>

<h3>Skill</h3>
<select id="attr"></select>
<select id="skill"></select>

<h3>Severity</h3>
<div id="severity"></div>

<button class="primary" onclick="roll()">🎲 GENERUJ</button>

<div id="resultBox" class="card hidden"></div>

<h3>Pošli hráči</h3>
<div id="targets"></div>

</div>

<div id="playerPanel" class="hidden">
<h3>Hráči</h3>
<div id="players"></div>

<h3>Výsledek</h3>
<div id="result" class="card">Čekám...</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  databaseURL:"https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
});
const db = getDatabase(app);

let FAIL_DATA={};
let state={
room:"",name:"",id:"",isDM:false,
type:"attack",attack:"Melee",severity:"Lehký",
last:null,lastActivity:Date.now()
};

// ===== LOAD JSON =====
fetch("crit_fails.json").then(r=>r.json()).then(d=>{
FAIL_DATA=d;
buildSeverity();
buildSkills();
});

// ===== BUILD =====
function buildSeverity(){
["Lehký","Střední","Těžký","Sranda"].forEach(s=>{
document.getElementById("severity").innerHTML+=
`<button onclick="state.severity='${s}'">${s}</button>`;
});
}

function buildSkills(){
const attrs=Object.keys(FAIL_DATA["Skill"]||{});
const attr=document.getElementById("attr");
const skill=document.getElementById("skill");

attr.innerHTML=attrs.map(a=>`<option>${a}</option>`).join("");

attr.onchange=()=>{
const skills=Object.keys(FAIL_DATA["Skill"][attr.value]);
skill.innerHTML=skills.map(s=>`<option>${s}</option>`).join("");
};
attr.dispatchEvent(new Event("change"));
}

// ===== RANDOM =====
function weighted(pool){
let sum=pool.reduce((a,b)=>a+(b.weight||1),0);
let r=Math.random()*sum;
for(let p of pool){ r-=p.weight||1; if(r<=0)return p;}
return pool[0];
}

// ===== ROLL =====
window.roll=()=>{
let pool;

if(state.type==="attack") pool=FAIL_DATA["Útok"]?.[state.attack]?.[state.severity];
if(state.type==="defense") pool=FAIL_DATA["Obrana"]?.[state.severity];
if(state.type==="skill"){
const a=attr.value,s=skill.value;
pool=FAIL_DATA["Skill"]?.[a]?.[s]?.[state.severity];
}

if(!pool||pool.length===0){
pool=FAIL_DATA["Útok"]?.[state.attack]?.["Lehký"];
}

const r=weighted(pool);

state.last=r;

document.getElementById("resultBox").innerHTML=`
<div>⚠️ ${r.effect}</div>
<div>🎭 ${r.roleplay[0]}</div>
<div>🎭 ${r.roleplay[1]}</div>
`;

document.getElementById("resultBox").classList.remove("hidden");

state.lastActivity=Date.now();
};

// ===== SEND =====
window.send=(id,type)=>{
if(!state.last) return;

let msg="⚠️ "+state.last.effect+"\n";

if(type==="r1") msg+=state.last.roleplay[0];
if(type==="r2") msg+=state.last.roleplay[1];
if(type==="all") msg+=state.last.roleplay.join(" | ");

set(ref(db,"rooms/"+state.room+"/msg/"+id),msg);
};

// ===== FIREBASE =====
window.createRoom=async()=>{
state={...state,
room:room.value,name:name.value,
id:"DM_"+Date.now(),isDM:true};

await set(ref(db,"rooms/"+state.room),{
players:{[state.id]:{name:state.name+" 👑"}},
lastActive:Date.now()
});

start();
};

window.joinRoom=async(r)=>{
const id="P_"+Date.now();
await set(ref(db,"rooms/"+r+"/players/"+id),{name:name.value});
state={...state,room:r,name:name.value,id,isDM:false};
start();
};

function start(){
setup.classList.add("hidden");
app.classList.remove("hidden");

roomTitle.innerText=state.room;

dmPanel.classList.toggle("hidden",!state.isDM);
playerPanel.classList.toggle("hidden",state.isDM);

topBtns.innerHTML=`
<button onclick="logout()">🚪</button>
${state.isDM?`<button onclick="deleteRoom()">🗑️</button>`:""}
`;

onDisconnect(ref(db,"rooms/"+state.room+"/players/"+state.id)).remove();

listenPlayers();

if(!state.isDM){
onValue(ref(db,"rooms/"+state.room+"/msg/"+state.id),snap=>{
if(snap.val()) result.innerText=snap.val();
});
}

// auto delete after 5 min
setInterval(()=>{
if(state.isDM){
if(Date.now()-state.lastActivity>300000){
remove(ref(db,"rooms/"+state.room));
alert("Room smazána (neaktivita)");
location.reload();
}
}
},10000);
}

function listenPlayers(){
onValue(ref(db,"rooms/"+state.room+"/players"),snap=>{
const p=snap.val()||{};

playersTop.innerText=Object.values(p).map(x=>x.name).join(" | ");

players.innerHTML=Object.values(p).map(x=>`<div>${x.name}</div>`).join("");

targets.innerHTML=Object.entries(p)
.filter(([id])=>id!==state.id)
.map(([id,x])=>`
<div>
${x.name}
<button onclick="send('${id}','r1')">R1</button>
<button onclick="send('${id}','r2')">R2</button>
<button onclick="send('${id}','all')">ALL</button>
</div>
`).join("");
});
}

// ===== LOBBY =====
onValue(ref(db,"rooms"),snap=>{
const d=snap.val()||{};
rooms.innerHTML=Object.keys(d)
.map(r=>`<div>${r}<button onclick="joinRoom('${r}')">Join</button></div>`)
.join("");
});

// ===== ACTIONS =====
window.logout=()=>location.reload();
window.deleteRoom=()=>remove(ref(db,"rooms/"+state.room));
window.setType=t=>state.type=t;
window.setAttack=a=>state.attack=a;
</script>

</body>
</html>

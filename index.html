<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KritFailer</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0e0e0e;
  color:white;
}

header {
  background:#1a1a1a;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title {
  color:#ff9800;
  font-weight:bold;
  font-size:20px;
}

.players {
  font-size:14px;
}

.container {
  padding:15px;
}

button {
  padding:8px 12px;
  margin:4px;
  border-radius:8px;
  border:none;
  background:#222;
  color:white;
  cursor:pointer;
}

button:hover { background:#444; }

.selected { background:#ff9800; }

.card {
  background:#1a1a1a;
  padding:10px;
  margin-top:5px;
  border-radius:10px;
}

input {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<header>
  <div class="title">🎲 KritFailer</div>
  <div id="playersTop" class="players"></div>
  <div>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div id="setup" class="container">
  <input id="name" placeholder="Jméno"><br>
  <input id="room" placeholder="Room"><br>
  <button onclick="joinDM()">👑 DM</button>
  <button onclick="joinPlayer()">🎭 Hráč</button>
</div>

<div id="app" class="container" style="display:none;">

  <div id="dmControls" style="display:none;">
    <button onclick="setSeverity('Lehký')" id="sLehký">Lehký</button>
    <button onclick="setSeverity('Střední')" id="sStřední">Střední</button>
    <button onclick="setSeverity('Těžký')" id="sTěžký">Těžký</button>
    <button onclick="setSeverity('Sranda')" id="sSranda">Sranda</button>

    <br>

    <button onclick="generateAttack()">⚔️ Útok</button>
    <button onclick="generateDefense()">🛡️ Obrana</button>
    <button onclick="deleteRoom()">🗑️ Smazat room</button>
  </div>

  <h3>🎲 Skilly</h3>
  <div id="skills"></div>

  <div id="playerBox"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, get, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= STATE =================

let room="", name="", myId="", isDM=false;
let players={}, data={}, severity="Lehký", currentPool=[];

// ================= SESSION =================

if(localStorage.room){
  room = localStorage.room;
  name = localStorage.name;
  isDM = localStorage.isDM==="true";
  reconnect();
}

// ================= LOAD JSON =================

fetch("crit_fails.json").then(r=>r.json()).then(j=>{
  data=j;
  buildSkills();
});

// ================= ID =================

function makeId(prefix){
  return prefix+"_"+Date.now();
}

// ================= LOGIN =================

window.joinDM = async function(){

  room = roomInput();
  name = nameInput();
  isDM = true;

  const snap = await get(ref(db,"rooms/"+room+"/players"));
  const playersData = snap.val();

  if(playersData){
    if(Object.values(playersData).some(p=>p.name.includes("👑"))){
      alert("DM už existuje");
      return;
    }
  }

  myId = makeId("DM");

  await set(ref(db,"rooms/"+room+"/players/"+myId),{
    name:name+" 👑"
  });

  saveSession();
  start();
}

window.joinPlayer = async function(){

  room = roomInput();
  name = nameInput();

  const snap = await get(ref(db,"rooms/"+room+"/players"));
  const playersData = snap.val() || {};

  if(Object.values(playersData).some(p=>p.name===name)){
    myId = Object.keys(playersData).find(k=>playersData[k].name===name);
  } else {
    myId = makeId("P");
    await set(ref(db,"rooms/"+room+"/players/"+myId),{ name });
  }

  saveSession();
  start();
}

// ================= RECONNECT =================

function reconnect(){
  start();
}

// ================= START =================

function start(){

  document.getElementById("setup").style.display="none";
  document.getElementById("app").style.display="block";

  if(isDM) document.getElementById("dmControls").style.display="block";

  onDisconnect(ref(db,"rooms/"+room+"/players/"+myId)).remove();

  listenPlayers();
  listenMessages();
}

// ================= PLAYERS =================

function listenPlayers(){
  onValue(ref(db,"rooms/"+room+"/players"), snap=>{
    players = snap.val() || {};

    const list = Object.values(players).map(p=>p.name).join(" | ");
    document.getElementById("playersTop").innerText = list;

    if(Object.keys(players).length===0){
      remove(ref(db,"rooms/"+room));
    }
  });
}

// ================= GENERATE =================

window.generateSkill = function(attr, skill, btn){

  currentPool = data.Skill[attr][skill][severity] || [];

  const r = rand(currentPool);

  renderUnder(btn,r);
}

// ================= RENDER =================

function renderUnder(btn, r){

  if(btn.nextElementSibling?.classList.contains("card")){
    btn.nextElementSibling.remove();
  }

  let html="";

  Object.entries(players).forEach(([id,p])=>{
    if(!p.name.includes("👑")){
      html+=`<button onclick="send('${id}', '${r.effect}')">${p.name}</button>`;
    }
  });

  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`
    <b>${r.effect}</b><br>
    ${r.roleplay.join("<br>")}<br><br>
    <button onclick="reroll(this)">🔄</button><br>
    ${html}
  `;

  btn.after(div);
}

window.reroll=function(btn){
  const r=rand(currentPool);
  btn.parentNode.innerHTML=r.effect;
}

// ================= SEND =================

window.send = function(pid, text){
  set(ref(db,"rooms/"+room+"/msg/"+pid), text);
}

// ================= RECEIVE =================

function listenMessages(){
  onValue(ref(db,"rooms/"+room+"/msg/"+myId), snap=>{
    if(snap.val()){
      document.getElementById("playerBox").innerText=snap.val();
    }
  });
}

// ================= DELETE ROOM =================

window.deleteRoom = function(){
  remove(ref(db,"rooms/"+room));
  logout();
}

// ================= LOGOUT =================

window.logout = function(){
  localStorage.clear();
  location.reload();
}

// ================= HELPERS =================

function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function nameInput(){
  return document.getElementById("name").value;
}

function roomInput(){
  return document.getElementById("room").value;
}

function saveSession(){
  localStorage.room=room;
  localStorage.name=name;
  localStorage.isDM=isDM;
}

// ================= SKILLS =================

function buildSkills(){

  let html="";

  Object.entries(data.Skill).forEach(([attr,skills])=>{
    html+=`<h4>${attr}</h4>`;
    Object.keys(skills).forEach(s=>{
      html+=`<button onclick="generateSkill('${attr}','${s}', this)">${s}</button>`;
    });
  });

  document.getElementById("skills").innerHTML=html;
}

</script>

</body>
</html>

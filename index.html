<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KritFailer</title>

<style>
body { margin:0; font-family:Arial; background:#0e0e0e; color:white; }

header {
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:#1a1a1a;
}

.title { color:#ff9800; font-weight:bold; }

.container { padding:12px; }

button {
  margin:4px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
  cursor:pointer;
}

button:hover { background:#444; }

.active { background:#ff9800 !important; }

.card {
  background:#1a1a1a;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
}

.meta { color:#aaa; font-size:12px; }

/* hráči barvy */
.player1 { background:#ef4444; }
.player2 { background:#22c55e; }
.player3 { background:#3b82f6; }
.player4 { background:#eab308; }
.player5 { background:#a855f7; }

.room {
  background:#1a1a1a;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
  <div class="title">🎲 KritFailer</div>
  <div id="playersTop"></div>
  <div id="topButtons"></div>
</header>

<div id="setup" class="container">

  <input id="name" placeholder="Jméno"><br>
  <input id="roomName" placeholder="Název místnosti"><br>
  <input id="roomPass" placeholder="Heslo (volitelné)"><br>

  <button onclick="createRoom()">🎲 Vytvořit místnost</button>

  <h3>Otevřené hry</h3>
  <div id="roomsList"></div>

</div>

<div id="app" class="container" style="display:none;">

  <div id="dmPanel" style="display:none;">
    <div id="severityButtons"></div>

    <h3>Akce</h3>
    <button onclick="generateAttack('Melee', this)">⚔️ Melee</button>
    <button onclick="generateAttack('Ranged', this)">🏹 Ranged</button>
    <button onclick="generateDefense(this)">🛡️ Obrana</button>

    <h3>🎲 Skilly</h3>
    <div id="skills"></div>
  </div>

  <div id="playerPanel" style="display:none;">
    <h3 id="roomNameDisplay"></h3>
    <div id="playerResult">Čekám na výsledek...</div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, get, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== STATE =====
let room="", name="", myId="", isDM=false;
let players={}, data={};
let severityList=[], severity="";

// ===== LOAD JSON =====
fetch("crit_fails.json").then(r=>r.json()).then(j=>{
  data=j;
  buildSeverity();
  buildSkills();
});

// ===== WEIGHT =====
function weightedRandom(pool){
  let total=0;
  pool.forEach(p=> total += p.weight || 1);
  let r=Math.random()*total;
  for(let item of pool){
    r -= item.weight || 1;
    if(r<=0) return item;
  }
  return pool[0];
}

// ===== CREATE ROOM =====
async function createRoom(){

  name = val("name");
  const roomName = val("roomName");
  const password = val("roomPass");

  if(!name || !roomName){
    alert("Vyplň jméno a název místnosti");
    return;
  }

  room = roomName;
  myId = "DM_"+Date.now();
  isDM = true;

  await set(ref(db,"rooms/"+room),{
    dm: myId,
    password: password || null,
    players:{
      [myId]:{ name:name+" 👑" }
    }
  });

  save();
  start();
}
window.createRoom = createRoom;

// ===== LOBBY =====
onValue(ref(db,"rooms"), snap=>{
  const rooms = snap.val() || {};
  let html="";

  Object.entries(rooms).forEach(([r,d])=>{
    const count = d.players ? Object.keys(d.players).length : 0;

    html += `
      <div class="room">
        🎲 ${r} (${count})
        <button onclick="joinRoom('${r}')">Join</button>
      </div>
    `;
  });

  document.getElementById("roomsList").innerHTML = html;
});

// ===== JOIN =====
async function joinRoom(r){

  name = val("name");
  if(!name){ alert("Zadej jméno"); return; }

  const snap = await get(ref(db,"rooms/"+r));
  const d = snap.val();

  if(d.password){
    const pass = prompt("Zadej heslo:");
    if(pass !== d.password){
      alert("Špatné heslo");
      return;
    }
  }

  room = r;
  myId = "P_"+Date.now();
  isDM = false;

  await set(ref(db,"rooms/"+room+"/players/"+myId),{ name });

  save();
  start();
}
window.joinRoom = joinRoom;

// ===== START =====
function start(){

  document.getElementById("setup").style.display="none";
  document.getElementById("app").style.display="block";

  if(isDM){
    document.getElementById("dmPanel").style.display="block";
    document.getElementById("topButtons").innerHTML =
      `<button onclick="deleteRoom()">🗑️</button><button onclick="logout()">Logout</button>`;
  } else {
    document.getElementById("playerPanel").style.display="block";
    document.getElementById("roomNameDisplay").innerText="Room: "+room;
    document.getElementById("topButtons").innerHTML =
      `<button onclick="logout()">Logout</button>`;
  }

  onDisconnect(ref(db,"rooms/"+room+"/players/"+myId)).remove();
  if(isDM) onDisconnect(ref(db,"rooms/"+room)).remove();

  onValue(ref(db,"rooms/"+room+"/players"), snap=>{
    players = snap.val() || {};
    document.getElementById("playersTop").innerText =
      Object.values(players).map(p=>p.name).join(" | ");
  });

  listenMessages();
}

// ===== GENERATE =====
function getPoolSafe(s){
  if(!s) return [];
  if(s[severity]?.length) return s[severity];
  for(const k in s){ if(s[k]?.length) return s[k]; }
  return [];
}

function generateAttack(type,btn){
  render(btn,getPoolSafe(data["Útok"]?.[type]),"Útok");
}
window.generateAttack = generateAttack;

function generateDefense(btn){
  render(btn,getPoolSafe(data["Obrana"]),"Obrana");
}
window.generateDefense = generateDefense;

function generateSkill(attr,skill,btn){
  render(btn,getPoolSafe(data.Skill?.[attr]?.[skill]),`Skill (${skill})`);
}
window.generateSkill = generateSkill;

// ===== RENDER =====
function render(btn,pool,label){

  if(!pool.length){ alert("Žádná data"); return; }

  const r = weightedRandom(pool);

  btn.parentNode.querySelectorAll(".card").forEach(e=>e.remove());

  let html="";
  let i=1;

  Object.entries(players).forEach(([id,p])=>{
    if(!p.name.includes("👑")){
      html += `<button class="player${i}" onclick="send('${id}','${r.effect}')">${p.name}</button>`;
      i++;
    }
  });

  const div=document.createElement("div");
  div.className="card";
  div.innerHTML="🎲 Rolling...";
  btn.after(div);

  setTimeout(()=>{
    div.innerHTML=`
      <div class="meta">${severity} | ${label}</div>
      <b>${r.effect}</b><br>
      ${r.roleplay.join("<br>")}<br><br>
      ${html}
    `;
  },400);
}

// ===== FIREBASE =====
function send(pid,text){
  set(ref(db,"rooms/"+room+"/msg/"+pid),text);
}
window.send = send;

function listenMessages(){
  onValue(ref(db,"rooms/"+room+"/msg/"+myId),snap=>{
    if(snap.val()){
      document.getElementById("playerResult").innerText = snap.val();
    }
  });
}

// ===== HELPERS =====
function val(id){ return document.getElementById(id).value; }

function save(){
  localStorage.room=room;
  localStorage.name=name;
  localStorage.myId=myId;
  localStorage.isDM=isDM;
}

function deleteRoom(){ remove(ref(db,"rooms/"+room)); }
window.deleteRoom = deleteRoom;

function logout(){ localStorage.clear(); location.reload(); }
window.logout = logout;

// ===== SKILLS =====
function buildSkills(){
  let html="";
  Object.entries(data.Skill).forEach(([attr,skills])=>{
    html+=`<h4>${attr}</h4>`;
    Object.keys(skills).forEach(s=>{
      html+=`<button onclick="generateSkill('${attr}','${s}',this)">${s}</button>`;
    });
  });
  document.getElementById("skills").innerHTML=html;
}

// ===== SEVERITY =====
function buildSeverity(){
  const set=new Set();

  ["Útok","Obrana","Skill"].forEach(t=>{
    if(!data[t]) return;
    if(t==="Skill"){
      Object.values(data[t]).forEach(a=>{
        Object.values(a).forEach(s=>{
          Object.keys(s).forEach(sev=>set.add(sev));
        });
      });
    }else if(t==="Útok"){
      Object.values(data[t]).forEach(x=>{
        Object.keys(x).forEach(sev=>set.add(sev));
      });
    }else{
      Object.keys(data[t]).forEach(sev=>set.add(sev));
    }
  });

  severityList=[...set];
  severity=severityList[0];

  let html="";
  severityList.forEach(sev=>{
    html+=`<button id="sev-${sev}" onclick="setSeverity('${sev}')">${sev}</button>`;
  });

  document.getElementById("severityButtons").innerHTML=html;
  setSeverity(severity);
}

function setSeverity(l){
  severity=l;
  document.querySelectorAll("#severityButtons button").forEach(b=>b.classList.remove("active"));
  document.getElementById("sev-"+l)?.classList.add("active");
}
window.setSeverity = setSeverity;

</script>

</body>
</html>

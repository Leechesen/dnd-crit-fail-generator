    function weightedRandom(pool) {
      if (!pool || pool.length === 0) return null;

      const totalWeight = pool.reduce((sum, item) => sum + (item.weight || 1), 0);
      let randomValue = Math.random() * totalWeight;

      for (const item of pool) {
        randomValue -= item.weight || 1;
        if (randomValue <= 0) return item;
      }

      return pool[0];
    }

    async function createRoom() {
      const name = getInputValue(elements.nameInput);
      const roomName = getInputValue(elements.roomNameInput);
      const password = getInputValue(elements.roomPassInput);

      if (!name || !roomName) {
        alert("Vyplň jméno a název místnosti");
        return;

      state.name = name;
      state.room = roomName;
      state.myId = "DM_" + Date.now();
      state.isDM = true;

      const roomData = {
        dm: state.myId,
        password: password || null,
        players: {
          [state.myId]: { name: name + DM_SUFFIX }
        }
      };

      await set(ref(database, "rooms/" + state.room), roomData);
      saveToLocalStorage();
      startGame();
    }

    function setupRoomsListener() {
      onValue(ref(database, "rooms"), (snapshot) => {
        const rooms = snapshot.val() || {};
        renderRoomsList(rooms);
      });
    }

    function renderRoomsList(rooms) {
      const roomEntries = Object.entries(rooms);
      
      if (roomEntries.length === 0) {
        elements.roomsList.innerHTML = "<p>Žádné aktivní místnosti</p>";
        return;
      }

      elements.roomsList.innerHTML = roomEntries
        .map(([roomName, roomData]) => {
          const playerCount = roomData.players ? Object.keys(roomData.players).length : 0;
          return `
            <div class="room">
              <span>🎲 ${escapeHtml(roomName)} (${playerCount})</span>
              <button data-room="${escapeHtml(roomName)}" class="join-btn">Join</button>
            </div>
          `;
        })
        .join("");

      elements.roomsList.querySelectorAll(".join-btn").forEach((btn) => {
        btn.addEventListener("click", () => joinRoom(btn.dataset.room));
      });
    }

    async function joinRoom(roomName) {
      const name = getInputValue(elements.nameInput);
      
      if (!name) {
        alert("Zadej jméno");
        return;
      }

      const snapshot = await get(ref(database, "rooms/" + roomName));
      const roomData = snapshot.val();

      if (!roomData) {
        alert("Místnost neexistuje");
        return;
      }

      if (roomData.password) {
        const enteredPassword = prompt("Zadej heslo:");
        if (enteredPassword !== roomData.password) {
          alert("Špatné heslo");
          return;
        }
      }

      state.name = name;
      state.room = roomName;
      state.myId = localStorage.getItem(STORAGE_KEYS.MY_ID) || "P_" + Date.now();
      state.isDM = false;

      await set(ref(database, "rooms/" + state.room + "/players/" + state.myId), { name });
      saveToLocalStorage();
      startGame();
    }

      elements.setup.classList.add("hidden");
      elements.app.classList.remove("hidden");

      if (state.isDM) {
        setupDMView();
      } else {
        setupPlayerView();
      }

      setupDisconnectHandlers();
      setupPlayersListener();
      setupMessagesListener();
    }

    function setupDMView() {
      elements.dmPanel.classList.remove("hidden");
      elements.topButtons.innerHTML = `
        <button id="deleteRoomBtn">🗑️</button>
        <button id="logoutBtn">Logout</button>
      `;
      
      document.getElementById("deleteRoomBtn").addEventListener("click", deleteRoom);
      document.getElementById("logoutBtn").addEventListener("click", logout);
    }

    function setupPlayerView() {
      elements.playerPanel.classList.remove("hidden");
      elements.roomNameDisplay.textContent = "Room: " + state.room;
      elements.topButtons.innerHTML = `<button id="logoutBtn">Logout</button>`;
      
      document.getElementById("logoutBtn").addEventListener("click", logout);
    }

    function setupDisconnectHandlers() {
      const playerRef = ref(database, "rooms/" + state.room + "/players/" + state.myId);
      onDisconnect(playerRef).remove();

      if (state.isDM) {
        const roomRef = ref(database, "rooms/" + state.room);
        onDisconnect(roomRef).remove();
      }
    }

    function setupPlayersListener() {
      onValue(ref(database, "rooms/" + state.room + "/players"), (snapshot) => {
        state.players = snapshot.val() || {};
        const playerNames = Object.values(state.players).map((p) => p.name);

        elements.playersTop.textContent = playerNames.join(" | ");

        if (elements.playersList) {
          elements.playersList.innerHTML = playerNames
            .map((name) => `<div>👤 ${escapeHtml(name)}</div>`)
            .join("");

      });

    function setupMessagesListener() {
      onValue(ref(database, "rooms/" + state.room + "/msg/" + state.myId), (snapshot) => {
        const messageData = snapshot.val();
        if (!messageData) return;

        if (typeof messageData === "string") {
          elements.playerResult.textContent = messageData;
          return;
        }

        elements.playerResult.innerHTML = `
          <div class="card">
            <div class="meta">🎯 ${escapeHtml(messageData.severity)} | ${escapeHtml(messageData.label)}</div>

            <div class="roleplay-box">
              ${messageData.roleplay.map((line) => escapeHtml(line)).join("<br>")}
            </div>
          </div>
        `;
      });
    }

      for (const key in severityData) {
        if (severityData[key]?.length) {
          return severityData[key];
        }
      }
      
      return [];
    }

      const pool = getPoolForSeverity(state.critFailData["Obrana"]);
      renderResult(button, pool, "Obrana");

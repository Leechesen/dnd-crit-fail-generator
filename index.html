<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>KritFailer FINAL</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #ffffff;
}

header {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #f3f3f3;
}

button {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.primary { background: orange; color: white; }
.active { background: #ff9800; }

.container { padding: 12px; }

.card {
  background: #f5f5f5;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

.hidden { display: none; }
</style>
</head>

<body>

<header>
  <div>🎲 KritFailer</div>
  <div id="playersTop"></div>
  <div id="topBtns"></div>
</header>

<div id="setup" class="container">
  <input id="name" placeholder="Jméno">
  <input id="roomName" placeholder="Místnost">
  <button class="primary" onclick="createRoom()">Vytvořit</button>

  <h3>Lobby</h3>
  <div id="rooms"></div>
</div>

<div id="app" class="container hidden">

  <h3 id="roomTitle"></h3>

  <!-- DM -->
  <div id="dmPanel" class="hidden">

    <h3>Typ</h3>
    <button onclick="setType('attack')">⚔️ Útok</button>
    <button onclick="setType('defense')">🛡️ Obrana</button>

    <h3>Attack type</h3>
    <button onclick="setAttack('Melee')">Melee</button>
    <button onclick="setAttack('Ranged')">Ranged</button>

    <h3>Severity</h3>
    <div id="severity"></div>

    <button class="primary" onclick="roll()">🎲 GENERUJ</button>

    <div id="resultBox" class="card hidden"></div>

    <h3>Pošli hráči</h3>
    <div id="targets"></div>

  </div>

  <!-- PLAYER -->
  <div id="playerPanel" class="hidden">
    <h3>Hráči</h3>
    <div id="playersList"></div>

    <h3>Výsledek</h3>
    <div id="playerResult" class="card">Čekám...</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSy...",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
});
const db = getDatabase(app);

// ===== STATE =====
let FAIL_DATA = {};
let state = {
  room:"",
  name:"",
  id:"",
  isDM:false,
  type:"attack",
  attack:"Melee",
  severity:"Lehký",
  last:""
};

// ===== LOAD JSON =====
async function loadJSON(){
  const res = await fetch("crit_fails.json");
  FAIL_DATA = await res.json();
  buildSeverity();
}
loadJSON();

// ===== UI =====
function buildSeverity(){
  const list = ["Lehký","Střední","Těžký","Sranda"];
  document.getElementById("severity").innerHTML =
    list.map(s=>`<button onclick="setSeverity('${s}')">${s}</button>`).join("");
}

window.setType = t => state.type = t;
window.setAttack = a => state.attack = a;
window.setSeverity = s => state.severity = s;

// ===== RANDOM =====
function weighted(pool){
  let sum = pool.reduce((a,b)=>a+(b.weight||1),0);
  let r = Math.random()*sum;
  for(let p of pool){
    r -= (p.weight||1);
    if(r<=0) return p;
  }
  return pool[0];
}

// ===== CORE =====
window.roll = () => {

  let pool;

  if(state.type==="attack"){
    pool = FAIL_DATA["Útok"]?.[state.attack]?.[state.severity];
  }

  if(state.type==="defense"){
    pool = FAIL_DATA["Obrana"]?.[state.severity];
  }

  if(!pool || pool.length===0){
    alert("Nic v JSON");
    return;
  }

  const r = weighted(pool);

  state.last =
    "⚠️ " + r.effect +
    "\n\n🎭 " + r.roleplay.join(" | ");

  const box = document.getElementById("resultBox");
  box.innerText = state.last;
  box.classList.remove("hidden");
};

// ===== FIREBASE =====
window.createRoom = async () => {
  const name = document.getElementById("name").value;
  const room = document.getElementById("roomName").value;

  state = {...state, room, name, id:"DM_"+Date.now(), isDM:true};

  await set(ref(db,"rooms/"+room),{
    players:{
      [state.id]:{name:name+" 👑"}
    }
  });

  start();
};

window.joinRoom = async (room) => {
  const name = document.getElementById("name").value;
  const id = "P_"+Date.now();

  await set(ref(db,"rooms/"+room+"/players/"+id),{name});

  state = {...state, room, name, id, isDM:false};

  start();
};

function start(){
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("roomTitle").innerText = state.room;

  document.getElementById("dmPanel").classList.toggle("hidden",!state.isDM);
  document.getElementById("playerPanel").classList.toggle("hidden",state.isDM);

  listenPlayers();

  if(!state.isDM){
    onValue(ref(db,"rooms/"+state.room+"/msg/"+state.id),snap=>{
      if(snap.val()){
        document.getElementById("playerResult").innerText = snap.val();
      }
    });
  }
}

function listenPlayers(){
  onValue(ref(db,"rooms/"+state.room+"/players"),snap=>{
    const players = snap.val()||{};

    document.getElementById("playersTop").innerText =
      Object.values(players).map(p=>p.name).join(" | ");

    document.getElementById("playersList").innerHTML =
      Object.values(players).map(p=>`<div>${p.name}</div>`).join("");

    document.getElementById("targets").innerHTML =
      Object.entries(players)
      .filter(([id])=>!id.startsWith("DM_"))
      .map(([id,p])=>`<button onclick="send('${id}')">${p.name}</button>`)
      .join("");
  });
}

window.send = async (id)=>{
  if(!state.last) return alert("Nejdřív generuj");

  await set(ref(db,"rooms/"+state.room+"/msg/"+id),state.last);
};

// ===== LOBBY =====
onValue(ref(db,"rooms"),snap=>{
  const data = snap.val()||{};
  document.getElementById("rooms").innerHTML =
    Object.keys(data)
    .map(r=>`<div>${r} <button onclick="joinRoom('${r}')">Join</button></div>`)
    .join("");
});
</script>

</body>
</html>

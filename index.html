<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DnD Crit Fail</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

button {
  padding: 12px;
  margin: 6px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  background: #222;
  color: white;
}

button:hover {
  background: #444;
}

.card {
  margin-top: 20px;
  font-size: 18px;
  white-space: pre-line;
  padding: 15px;
  border-radius: 12px;
  background: #1a1a1a;
}

.section {
  margin-top: 15px;
}
</style>
</head>

<body>

<h1>🎲 DnD Crit Fail</h1>

<!-- SETUP -->
<div id="setup">
  <input id="name" placeholder="Tvoje jméno">
  <input id="room" placeholder="Room code (např. ABC)">
  <br>
  <button onclick="joinDM()">Jsem DM</button>
  <button onclick="joinPlayer()">Jsem hráč</button>
</div>

<!-- DM PANEL -->
<div id="dmPanel" style="display:none;">
  <h2>👑 DM Panel</h2>

  <div id="players"></div>

  <div id="buttons"></div>

  <button onclick="send()">📤 Pošli hráči</button>

  <div class="card" id="dmResult">---</div>

  <button onclick="reroll()">🔄 Generuj znovu</button>
</div>

<!-- PLAYER -->
<div id="playerView" style="display:none;">
  <h2>🎭 Tvoje událost</h2>
  <div class="card" id="playerResult">Čekám na DM...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  authDomain: "ktit-fail-generator.firebaseapp.com",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ktit-fail-generator",
  storageBucket: "ktit-fail-generator.firebasestorage.app",
  messagingSenderId: "1077220217346",
  appId: "1:1077220217346:web:56378b0ed6d52774f88d1b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =========================
// JSON LOAD
// =========================

let critData = {};

fetch("crit_fails.json")
  .then(res => res.json())
  .then(data => {
    critData = data;
    console.log("JSON loaded");
    buildButtons();
  });

// =========================

let myId = "";
let room = "";
let currentResult = "";
let selectedPlayer = null;
let lastPool = null;

// =========================
// JOIN
// =========================

window.joinDM = function() {
  room = document.getElementById("room").value;

  document.getElementById("setup").style.display = "none";
  document.getElementById("dmPanel").style.display = "block";

  listenPlayers();
}

window.joinPlayer = function() {
  room = document.getElementById("room").value;
  const name = document.getElementById("name").value;

  myId = name + "_" + Math.floor(Math.random()*1000);

  set(ref(db, 'rooms/' + room + '/players/' + myId), {
    name: name
  });

  document.getElementById("setup").style.display = "none";
  document.getElementById("playerView").style.display = "block";

  onValue(ref(db, 'rooms/' + room + '/messages/' + myId), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      document.getElementById("playerResult").innerText = data.value;
    }
  });
}

// =========================
// PLAYERS
// =========================

function listenPlayers() {
  onValue(ref(db, 'rooms/' + room + '/players'), (snapshot) => {
    const players = snapshot.val() || {};
    const container = document.getElementById("players");

    container.innerHTML = "";

    Object.keys(players).forEach(id => {
      const btn = document.createElement("button");

      btn.innerText = players[id].name;

      btn.onclick = () => {
        selectedPlayer = id;

        document.querySelectorAll("#players button").forEach(b => b.style.background = "#222");
        btn.style.background = "#4CAF50";
      };

      container.appendChild(btn);
    });
  });
}

// =========================
// BUTTONS
// =========================

function buildButtons() {
  const container = document.getElementById("buttons");
  container.innerHTML = "";

  if (!critData["Útok"]) return;

  const section = document.createElement("div");
  section.className = "section";
  section.innerHTML = "<h3>⚔️ Útok (Melee)</h3>";

  ["Lehký", "Střední", "Těžký"].forEach(severity => {
    const btn = document.createElement("button");

    btn.innerText = severity;

    btn.onclick = () => generate("Útok", "Melee", severity);

    section.appendChild(btn);
  });

  container.appendChild(section);
}

// =========================
// GENERATE
// =========================

function generate(type, sub, severity) {

  const pool = critData[type][sub][severity];

  if (!pool || pool.length === 0) {
    alert("Žádná data");
    return;
  }

  lastPool = pool;

  const random = pool[Math.floor(Math.random() * pool.length)];

  currentResult =
    `🎯 ${type} → ${sub} (${severity})\n\n` +
    `💥 ${random.effect}\n\n` +
    `🎭 ${(random.roleplay || []).join(" ")}`;

  document.getElementById("dmResult").innerText = currentResult;
}

// =========================
// REROLL
// =========================

function reroll() {
  if (!lastPool) return;

  const random = lastPool[Math.floor(Math.random() * lastPool.length)];

  currentResult =
    `🔄 Znovu\n\n` +
    `💥 ${random.effect}\n\n` +
    `🎭 ${(random.roleplay || []).join(" ")}`;

  document.getElementById("dmResult").innerText = currentResult;
}

// =========================
// SEND
// =========================

window.send = function() {
  if (!selectedPlayer || !currentResult) return;

  set(ref(db, 'rooms/' + room + '/messages/' + selectedPlayer), {
    value: currentResult,
    time: Date.now()
  });
}

</script>

</body>
</html>

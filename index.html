<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DnD Crit Fail</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

button {
  padding: 10px 14px;
  margin: 4px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  cursor: pointer;
  background: #222;
  color: white;
}

button:hover {
  background: #444;
}

.card {
  margin-top: 10px;
  font-size: 16px;
  white-space: pre-line;
  padding: 12px;
  border-radius: 10px;
  background: #1a1a1a;
}

.section {
  margin-top: 15px;
}

.sev-btn {
  background: #222;
}

.sev-active {
  background: #ff9800 !important;
}
</style>
</head>

<body>

<h1>🎲 DnD Crit Fail</h1>

<div id="setup">
  <input id="name" placeholder="Tvoje jméno">
  <input id="room" placeholder="Room code">
  <br>
  <button onclick="joinDM()">Jsem DM</button>
  <button onclick="joinPlayer()">Jsem hráč</button>
</div>

<div id="dmPanel" style="display:none;">
  <h2>👑 DM Panel</h2>

  <div id="players"></div>
  <div id="severity"></div>
  <div id="buttons"></div>
</div>

<div id="playerView" style="display:none;">
  <h2>🎭 Tvoje událost</h2>
  <div class="card" id="playerResult">Čekám na DM...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  authDomain: "ktit-fail-generator.firebaseapp.com",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ktit-fail-generator",
  storageBucket: "ktit-fail-generator.firebasestorage.app",
  messagingSenderId: "1077220217346",
  appId: "1:1077220217346:web:56378b0ed6d52774f88d1b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =========================
// STATE
// =========================

let critData = {};
let room = "";
let myId = "";
let selectedPlayer = null;
let currentSeverity = "Lehký";
let lastState = null;
let activeContainer = null;
let currentResult = "";

// =========================
// LOAD JSON
// =========================

fetch("crit_fails.json")
  .then(res => res.json())
  .then(data => {
    critData = data;
    buildSeverity();
    buildButtons();
  });

// =========================
// JOIN
// =========================

window.joinDM = function() {
  room = document.getElementById("room").value;
  document.getElementById("setup").style.display = "none";
  document.getElementById("dmPanel").style.display = "block";
  listenPlayers();
}

window.joinPlayer = function() {
  room = document.getElementById("room").value;
  const name = document.getElementById("name").value;

  myId = name + "_" + Math.floor(Math.random()*1000);

  set(ref(db, 'rooms/' + room + '/players/' + myId), {
    name: name
  });

  document.getElementById("setup").style.display = "none";
  document.getElementById("playerView").style.display = "block";

  onValue(ref(db, 'rooms/' + room + '/messages/' + myId), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      document.getElementById("playerResult").innerText = data.value;
    }
  });
}

// =========================
// PLAYERS
// =========================

function listenPlayers() {
  onValue(ref(db, 'rooms/' + room + '/players'), (snapshot) => {
    const players = snapshot.val() || {};
    const container = document.getElementById("players");
    container.innerHTML = "";

    Object.keys(players).forEach(id => {
      const btn = document.createElement("button");
      btn.innerText = players[id].name;

      btn.onclick = () => {
        selectedPlayer = id;
        document.querySelectorAll("#players button").forEach(b => b.style.background = "#222");
        btn.style.background = "#4CAF50";
      };

      container.appendChild(btn);
    });
  });
}

// =========================
// SEVERITY
// =========================

function buildSeverity() {
  const container = document.getElementById("severity");
  container.innerHTML = "<h3>🎚️ Obtížnost</h3>";

  ["Lehký", "Střední", "Těžký", "Sranda"].forEach(sev => {
    const btn = document.createElement("button");

    btn.innerText = sev;
    btn.className = "sev-btn";

    if (sev === currentSeverity) {
      btn.classList.add("sev-active");
    }

    btn.onclick = () => {
      currentSeverity = sev;
      buildSeverity();
    };

    container.appendChild(btn);
  });
}

// =========================
// BUTTONS
// =========================

function buildButtons() {
  const container = document.getElementById("buttons");
  container.innerHTML = "";

  // ÚTOK
  if (critData["Útok"]) {
    const section = document.createElement("div");
    section.innerHTML = "<h3>⚔️ Útok</h3>";

    Object.keys(critData["Útok"]).forEach(type => {
      const btn = document.createElement("button");
      btn.innerText = type;
      btn.onclick = (e) => generate("Útok", type, e.target);
      section.appendChild(btn);
    });

    container.appendChild(section);
  }

  // OBRANA
  if (critData["Obrana"]) {
    const section = document.createElement("div");
    section.innerHTML = "<h3>🛡️ Obrana</h3>";

    const btn = document.createElement("button");
    btn.innerText = "Obrana";
    btn.onclick = (e) => generate("Obrana", null, e.target);

    section.appendChild(btn);
    container.appendChild(section);
  }

  // SKILLY
  if (critData["Skill"]) {
    const section = document.createElement("div");
    section.innerHTML = "<h3>🎲 Skilly</h3>";

    Object.keys(critData["Skill"]).forEach(attr => {
      const attrDiv = document.createElement("div");
      attrDiv.innerHTML = `<b>${attr}</b><br>`;

      Object.keys(critData["Skill"][attr]).forEach(skill => {
        const btn = document.createElement("button");
        btn.innerText = skill;
        btn.onclick = (e) => generate("Skill", {attr, skill}, e.target);
        attrDiv.appendChild(btn);
      });

      section.appendChild(attrDiv);
    });

    container.appendChild(section);
  }
}

// =========================
// GENERATE (INLINE RESULT)
// =========================

window.generate = function(type, sub, buttonElement) {

  let pool;

  if (type === "Útok") {
    pool = critData[type][sub][currentSeverity];
  } 
  else if (type === "Obrana") {
    pool = critData[type][currentSeverity];
  } 
  else if (type === "Skill") {
    pool = critData[type][sub.attr][sub.skill][currentSeverity];
  }

  if (!pool || pool.length === 0) {
    alert("Žádná data");
    return;
  }

  const random = pool[Math.floor(Math.random() * pool.length)];

  lastState = { pool, type, sub, severity: currentSeverity };

  let label = "";

  if (type === "Skill") {
    label = `${sub.attr} → ${sub.skill}`;
  } else if (sub) {
    label = sub;
  }

  currentResult =
    `🎯 ${type} → ${label} (${currentSeverity})\n\n` +
    `💥 ${random.effect}\n\n` +
    `🎭 ${(random.roleplay || []).join(" ")}`;

  if (activeContainer) activeContainer.remove();

  const box = document.createElement("div");
  box.className = "card";

  box.innerHTML = `
    ${currentResult}
    <br><br>
    <button onclick="reroll()">🔄 Generuj znovu</button>
    <button onclick="send()">📤 Pošli hráči</button>
  `;

  buttonElement.parentNode.insertBefore(box, buttonElement.nextSibling);
  activeContainer = box;
}

// =========================
// REROLL
// =========================

window.reroll = function() {
  if (!lastState) return;

  const pool = lastState.pool;
  const random = pool[Math.floor(Math.random() * pool.length)];

  let label = "";

  if (lastState.type === "Skill") {
    label = `${lastState.sub.attr} → ${lastState.sub.skill}`;
  } else if (lastState.sub) {
    label = lastState.sub;
  }

  currentResult =
    `🎯 ${lastState.type} → ${label} (${lastState.severity})\n\n` +
    `💥 ${random.effect}\n\n` +
    `🎭 ${(random.roleplay || []).join(" ")}`;

  activeContainer.innerHTML = `
    ${currentResult}
    <br><br>
    <button onclick="reroll()">🔄 Generuj znovu</button>
    <button onclick="send()">📤 Pošli hráči</button>
  `;
}

// =========================
// SEND
// =========================

window.send = function() {
  if (!selectedPlayer || !currentResult) return;

  set(ref(db, 'rooms/' + room + '/messages/' + selectedPlayer), {
    value: currentResult,
    time: Date.now()
  });
}

</script>

</body>
</html>

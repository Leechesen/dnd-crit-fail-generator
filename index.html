<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>KritFailer</title>
  <style>
    body { font-family: Arial; background: #fff; color: #000; }
    button { padding: 10px; margin: 5px; }
    .hidden { display: none; }
  </style>
</head>

<body>

<h2>🎲 KritFailer</h2>

<div id="setup">
  <input id="name" placeholder="Jméno">
  <input id="roomName" placeholder="Název místnosti">
  <button id="createRoomBtn">Vytvořit místnost</button>

  <h3>Lobby</h3>
  <div id="roomsList"></div>
</div>

<div id="app" class="hidden">
  <div id="topButtons"></div>
  <h3 id="roomTitle"></h3>

  <div id="dmPanel" class="hidden">
    <h3>DM</h3>
  </div>

  <div id="playerPanel" class="hidden">
    <h3>Hráči</h3>
    <div id="playersList"></div>
    <div id="result"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, set, get, onValue, remove, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);

let state = {
  room: "",
  name: "",
  id: "",
  isDM: false
};

// ===== CREATE ROOM =====
document.getElementById("createRoomBtn").onclick = async () => {
  const name = document.getElementById("name").value.trim();
  const room = document.getElementById("roomName").value.trim();

  if (!name || !room) return alert("Vyplň vše");

  state = {
    room,
    name,
    id: "DM_" + Date.now(),
    isDM: true
  };

  await set(ref(db, "rooms/" + room), {
    players: {
      [state.id]: { name: name + " 👑" }
    }
  });

  save();
  start();
};

// ===== JOIN ROOM =====
window.joinRoom = async (room) => {
  const name = document.getElementById("name").value.trim();
  if (!name) return alert("Zadej jméno");

  const id = "P_" + Date.now();

  await set(ref(db, "rooms/" + room + "/players/" + id), { name });

  state = { room, name, id, isDM: false };

  save();
  start();
};

// ===== ROOM LIST =====
onValue(ref(db, "rooms"), snap => {
  const data = snap.val() || {};
  let html = "";

  Object.keys(data).forEach(r => {
    html += `<button onclick="joinRoom('${r}')">${r}</button><br>`;
  });

  document.getElementById("roomsList").innerHTML = html;
});

// ===== START =====
function start() {
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("roomTitle").innerText = "Room: " + state.room;

  document.getElementById("dmPanel").classList.toggle("hidden", !state.isDM);
  document.getElementById("playerPanel").classList.toggle("hidden", state.isDM);

  document.getElementById("topButtons").innerHTML = `
    <button onclick="logout()">🚪 Logout</button>
    ${state.isDM ? `<button onclick="deleteRoom()">🗑️ Smazat room</button>` : ""}
  `;

  onDisconnect(ref(db, "rooms/" + state.room + "/players/" + state.id)).remove();

  onValue(ref(db, "rooms/" + state.room + "/players"), snap => {
    const players = snap.val() || {};
    let html = "";

    Object.values(players).forEach(p => {
      html += `<div>${p.name}</div>`;
    });

    document.getElementById("playersList").innerHTML = html;
  });
}

// ===== STORAGE =====
function save() {
  localStorage.setItem("room", state.room);
  localStorage.setItem("name", state.name);
  localStorage.setItem("id", state.id);
  localStorage.setItem("isDM", state.isDM);
}

// ===== LOGOUT =====
window.logout = () => {
  localStorage.clear();
  location.reload();
};

// ===== DELETE ROOM =====
window.deleteRoom = async () => {
  await remove(ref(db, "rooms/" + state.room));
  localStorage.clear();
  location.reload();
};

// ===== AUTO RECONNECT =====
const savedRoom = localStorage.getItem("room");
if (savedRoom) {
  state = {
    room: savedRoom,
    name: localStorage.getItem("name"),
    id: localStorage.getItem("id"),
    isDM: localStorage.getItem("isDM") === "true"
  };
  start();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KritFailer</title>

<style>
body { margin:0; font-family:Arial; background:#0e0e0e; color:white; }

header {
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:#1a1a1a;
}

.title { color:#ff9800; font-weight:bold; }

.container { padding:12px; }

button {
  margin:4px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
  cursor:pointer;
}

button:hover { background:#444; }

.card {
  background:#1a1a1a;
  padding:16px;
  margin-top:12px;
  border-radius:12px;
}

.meta { color:#aaa; font-size:12px; margin-bottom:8px; }

.str { background:#8b0000; }
.dex { background:#006400; }
.con { background:#444; }
.int { background:#1e3a8a; }
.wis { background:#6b21a8; }
.cha { background:#92400e; }

.room {
  background:#1a1a1a;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

#resultBox { margin-top:20px; }

</style>
</head>

<body>

<header>
  <div class="title">🎲 KritFailer</div>
  <div id="playersTop"></div>
  <div id="topButtons"></div>
</header>

<div id="setup" class="container">

  <input id="name" placeholder="Jméno"><br>

  <button onclick="createRoom()">🎲 Vytvořit místnost</button>

  <h3>Otevřené hry</h3>
  <div id="roomsList"></div>

</div>

<div id="app" class="container" style="display:none;">

  <div id="dmPanel" style="display:none;">
    <div id="severityButtons"></div>

    <h3>Akce</h3>
    <button onclick="generateAttack('Melee')">⚔️ Melee</button>
    <button onclick="generateAttack('Ranged')">🏹 Ranged</button>
    <button onclick="generateDefense()">🛡️ Obrana</button>

    <h3>🎲 Skilly</h3>
    <div id="skills"></div>

    <div id="resultBox"></div>
  </div>

  <div id="playerPanel" style="display:none;">
    <h3 id="roomName"></h3>
    <div id="playerResult">Čekám na výsledek...</div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, get, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== STATE =====
let room="", name="", myId="", isDM=false;
let players={}, data={};
let severityList=[], severity="";

// ===== LOAD JSON =====
fetch("crit_fails.json").then(r=>r.json()).then(j=>{
  data=j;
  buildSeverity();
  buildSkills();
});

// ===== WEIGHTED RANDOM =====
function weightedRandom(pool){
  let total = 0;
  pool.forEach(p=> total += p.weight || 1);
  let r = Math.random() * total;
  for(let item of pool){
    r -= item.weight || 1;
    if(r <= 0) return item;
  }
  return pool[0];
}

// ===== CREATE ROOM (DM) =====
async function createRoom(){

  name = val("name");

  if(!name){
    alert("Zadej jméno");
    return;
  }

  room = "room_" + Math.floor(Math.random()*100000);
  myId = "DM_" + Date.now();
  isDM = true;

  await set(ref(db, "rooms/" + room), {
    dm: myId,
    players: {
      [myId]: { name: name + " 👑" }
    }
  });

  save();
  start();
}
window.createRoom = createRoom;

// ===== LOBBY =====
onValue(ref(db,"rooms"), snap=>{
  const rooms = snap.val() || {};
  let html="";

  Object.entries(rooms).forEach(([r,data])=>{
    if(data.dm){
      const count = data.players ? Object.keys(data.players).length : 0;

      html += `
        <div class="room">
          🎲 ${r} (${count} hráčů)
          <button onclick="joinRoom('${r}')">Join</button>
        </div>
      `;
    }
  });

  document.getElementById("roomsList").innerHTML = html;
});

// ===== JOIN PLAYER =====
async function joinRoom(r){

  name = val("name");

  if(!name){
    alert("Zadej jméno");
    return;
  }

  room = r;
  myId = "P_" + Date.now();
  isDM = false;

  await set(ref(db,"rooms/"+room+"/players/"+myId),{ name });

  save();
  start();
}
window.joinRoom = joinRoom;

// ===== START =====
function start(){

  document.getElementById("setup").style.display="none";
  document.getElementById("app").style.display="block";

  if(isDM){
    document.getElementById("dmPanel").style.display="block";
    document.getElementById("topButtons").innerHTML =
      `<button onclick="deleteRoom()">🗑️</button><button onclick="logout()">Logout</button>`;
  } else {
    document.getElementById("playerPanel").style.display="block";
    document.getElementById("roomName").innerText="Room: "+room;
    document.getElementById("topButtons").innerHTML =
      `<button onclick="logout()">Logout</button>`;
  }

  onDisconnect(ref(db,"rooms/"+room+"/players/"+myId)).remove();

  if(isDM){
    onDisconnect(ref(db,"rooms/"+room)).remove();
  }

  onValue(ref(db,"rooms/"+room+"/players"), snap=>{
    players = snap.val() || {};
    document.getElementById("playersTop").innerText =
      Object.values(players).map(p=>p.name).join(" | ");
  });

  listenMessages();
}

// ===== GENERATE =====
function getPoolSafe(source){
  if(!source) return [];
  if(source[severity]?.length) return source[severity];
  for(const k in source){
    if(source[k]?.length) return source[k];
  }
  return [];
}

function generateAttack(type){
  render(getPoolSafe(data["Útok"]?.[type]), "Útok");
}
window.generateAttack = generateAttack;

function generateDefense(){
  render(getPoolSafe(data["Obrana"]), "Obrana");
}
window.generateDefense = generateDefense;

function generateSkill(attr, skill){
  render(getPoolSafe(data.Skill?.[attr]?.[skill]), `Skill (${skill})`);
}
window.generateSkill = generateSkill;

// ===== RENDER =====
function render(pool, label){

  const container = document.getElementById("resultBox");

  if(!pool.length){
    container.innerHTML = "❌ Žádná data";
    return;
  }

  const r = weightedRandom(pool);

  let playersHTML="";
  Object.entries(players).forEach(([id,p])=>{
    if(!p.name.includes("👑")){
      playersHTML += `<button onclick="send('${id}','${r.effect}')">${p.name}</button>`;
    }
  });

  container.innerHTML = `<div class="card"><div class="meta">🎲 Rolling...</div></div>`;

  setTimeout(()=>{
    container.innerHTML = `
      <div class="card">
        <div class="meta">${severity} | ${label}</div>
        <b>${r.effect}</b><br>
        ${r.roleplay.join("<br>")}<br><br>
        ${playersHTML}
      </div>
    `;
  }, 400);
}

// ===== FIREBASE =====
function send(pid,text){
  set(ref(db,"rooms/"+room+"/msg/"+pid), text);
}
window.send = send;

function listenMessages(){
  onValue(ref(db,"rooms/"+room+"/msg/"+myId), snap=>{
    if(snap.val()){
      document.getElementById("playerResult").innerText = snap.val();
    }
  });
}

// ===== HELPERS =====
function val(id){ return document.getElementById(id).value; }

function save(){
  localStorage.room=room;
  localStorage.name=name;
  localStorage.myId=myId;
  localStorage.isDM=isDM;
}

function deleteRoom(){
  remove(ref(db,"rooms/"+room));
}
window.deleteRoom = deleteRoom;

function logout(){
  localStorage.clear();
  location.reload();
}
window.logout = logout;

// ===== SKILLS =====
function buildSkills(){
  let html="";
  Object.entries(data.Skill).forEach(([attr,skills])=>{
    html+=`<h4>${attr}</h4>`;
    Object.keys(skills).forEach(s=>{
      html+=`<button class="${attr.toLowerCase()}" onclick="generateSkill('${attr}','${s}')">${s}</button>`;
    });
  });
  document.getElementById("skills").innerHTML=html;
}

// ===== SEVERITY =====
function buildSeverity(){
  const set = new Set();

  ["Útok","Obrana","Skill"].forEach(type=>{
    if(!data[type]) return;

    if(type==="Skill"){
      Object.values(data[type]).forEach(attr=>{
        Object.values(attr).forEach(skill=>{
          Object.keys(skill).forEach(sev=> set.add(sev));
        });
      });
    } else if(type==="Útok"){
      Object.values(data[type]).forEach(t=>{
        Object.keys(t).forEach(sev=> set.add(sev));
      });
    } else {
      Object.keys(data[type]).forEach(sev=> set.add(sev));
    }
  });

  severityList = Array.from(set);
  severity = severityList[0];

  let html="";
  severityList.forEach(sev=>{
    html += `<button id="sev-${sev}" onclick="setSeverity('${sev}')">${sev}</button>`;
  });

  document.getElementById("severityButtons").innerHTML = html;
  setSeverity(severity);
}

function setSeverity(level){
  severity = level;
  document.querySelectorAll("#severityButtons button").forEach(b=>b.classList.remove("active"));
  document.getElementById("sev-"+level)?.classList.add("active");
}
window.setSeverity = setSeverity;

</script>

</body>
</html>

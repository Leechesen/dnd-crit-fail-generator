<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KritFailer</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

input {
  padding: 8px;
  margin: 4px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px;
  margin: 4px;
  border-radius: 10px;
  border: none;
  background: #222;
  color: white;
  cursor: pointer;
}

button:hover { background: #444; }

.room {
  border: 1px solid #333;
  margin: 5px;
  padding: 8px;
  border-radius: 8px;
}

.card {
  margin-top: 10px;
  padding: 10px;
  background: #1a1a1a;
  border-radius: 10px;
  white-space: pre-line;
}

.logout { background: #aa3333; }
.player-btn { background: #2a3a5a; }
.sev-active { background: #ff9800 !important; }
</style>
</head>

<body>

<h1>🎲 KritFailer</h1>

<!-- SETUP / LOBBY -->
<div id="setup">

  <input id="name" placeholder="Tvoje jméno"><br>

  <h3>🆕 Vytvořit místnost</h3>
  <input id="room" placeholder="Room code">
  <input id="password" placeholder="Heslo (volitelné)">
  <br>
  <button onclick="joinDM()">Vytvořit jako DM</button>

  <h3>🎮 Aktivní místnosti</h3>
  <div id="roomList"></div>

</div>

<!-- DM PANEL -->
<div id="dmPanel" style="display:none;">
  <h2>👑 DM Panel</h2>

  <button class="logout" onclick="logout()">🚪 Logout</button>
  <button onclick="deleteRoomManual()">🧹 Smazat room</button>

  <div id="players"></div>
  <div id="severity"></div>
  <div id="buttons"></div>
</div>

<!-- PLAYER -->
<div id="playerView" style="display:none;">
  <h2>🎭 Tvoje událost</h2>

  <button class="logout" onclick="logout()">🚪 Logout</button>

  <div class="card" id="playerResult">Čekám na DM...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, get, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =========================
// STATE
// =========================

let critData = {};
let room = "";
let myId = "";
let currentSeverity = "Lehký";
let lastState = null;
let activeContainer = null;
let currentResult = "";
let currentPlayers = {};

// =========================
// LOAD JSON
// =========================

fetch("crit_fails.json")
  .then(res => res.json())
  .then(data => {
    critData = data;
    buildSeverity();
    buildButtons();
  });

// =========================
// LOBBY
// =========================

function loadRooms() {
  onValue(ref(db, 'rooms'), (snapshot) => {
    const list = document.getElementById("roomList");
    list.innerHTML = "";

    const rooms = snapshot.val() || {};

    Object.keys(rooms).forEach(r => {
      const div = document.createElement("div");
      div.className = "room";

      div.innerHTML = `
        <b>${r}</b><br>
        <button onclick="joinRoom('${r}')">Připojit</button>
      `;

      list.appendChild(div);
    });
  });
}

loadRooms();

// =========================
// ROOM STATUS
// =========================

function listenRoomStatus() {
  onValue(ref(db, 'rooms/' + room), (snapshot) => {
    if (!snapshot.exists()) {
      alert("Místnost byla ukončena");
      localStorage.clear();
      location.reload();
    }
  });
}

// =========================
// CLEANUP
// =========================

function deleteRoomIfEmpty() {
  const roomRef = ref(db, 'rooms/' + room);

  onValue(roomRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    const players = data.players;
    const createdAt = data.createdAt || 0;
    const age = Date.now() - createdAt;

    if ((!players || Object.keys(players).length === 0) && age > 10000) {
      set(roomRef, null);
    }

  }, { onlyOnce: true });
}

setInterval(() => {
  if (room) deleteRoomIfEmpty();
}, 10000);

// =========================
// JOIN DM
// =========================

window.joinDM = function() {
  const name = document.getElementById("name").value || "DM";
  room = document.getElementById("room").value;
  const password = document.getElementById("password").value;

  myId = "DM_" + Math.random();

  set(ref(db, 'rooms/' + room), {
    password: password || "",
    createdAt: Date.now()
  });

  const playerRef = ref(db, 'rooms/' + room + '/players/' + myId);
  set(playerRef, { name: name + " 👑" });
  onDisconnect(playerRef).remove();

  localStorage.setItem("role", "dm");
  localStorage.setItem("room", room);
  localStorage.setItem("id", myId);

  document.getElementById("setup").style.display = "none";
  document.getElementById("dmPanel").style.display = "block";

  listenPlayers();
  listenRoomStatus();
}

// =========================
// JOIN PLAYER
// =========================

window.joinRoom = async function(r) {
  const name = document.getElementById("name").value;
  if (!name) return alert("Zadej jméno");

  const pass = prompt("Zadej heslo");

  const snap = await get(ref(db, 'rooms/' + r));
  const data = snap.val();

  if (!data) return alert("Room neexistuje");

  if (data.password && data.password !== pass) {
    return alert("Špatné heslo");
  }

  room = r;
  myId = name + "_" + Math.random();

  const playerRef = ref(db, 'rooms/' + room + '/players/' + myId);
  set(playerRef, { name: name });
  onDisconnect(playerRef).remove();

  localStorage.setItem("role", "player");
  localStorage.setItem("room", room);
  localStorage.setItem("id", myId);

  document.getElementById("setup").style.display = "none";
  document.getElementById("playerView").style.display = "block";

  listenPlayerMessages();
  listenRoomStatus();
}

// =========================
// AUTO LOGIN
// =========================

document.addEventListener("DOMContentLoaded", () => {
  const role = localStorage.getItem("role");
  const savedRoom = localStorage.getItem("room");

  if (!role || !savedRoom) return;

  room = savedRoom;
  myId = localStorage.getItem("id");

  if (role === "dm") {
    document.getElementById("setup").style.display = "none";
    document.getElementById("dmPanel").style.display = "block";
    listenPlayers();
  }

  if (role === "player") {
    document.getElementById("setup").style.display = "none";
    document.getElementById("playerView").style.display = "block";
    listenPlayerMessages();
  }

  listenRoomStatus();
});

// =========================
// PLAYERS
// =========================

function listenPlayers() {
  onValue(ref(db, 'rooms/' + room + '/players'), (snapshot) => {
    currentPlayers = snapshot.val() || {};

    const div = document.getElementById("players");
    div.innerHTML = "<h3>👥 Připojeni:</h3>";

    Object.values(currentPlayers).forEach(p => {
      div.innerHTML += "• " + p.name + "<br>";
    });
  });
}

// =========================
// PLAYER VIEW
// =========================

function listenPlayerMessages() {
  onValue(ref(db, 'rooms/' + room + '/messages/' + myId), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      document.getElementById("playerResult").innerText = data.value;
    }
  });
}

// =========================
// LOGOUT
// =========================

window.logout = function() {
  deleteRoomIfEmpty();
  localStorage.clear();
  location.reload();
}

// =========================
// DELETE ROOM
// =========================

window.deleteRoomManual = function() {
  if (confirm("Smazat room?")) {
    set(ref(db, 'rooms/' + room), null);
  }
}

// =========================
// SEVERITY
// =========================

function buildSeverity() {
  const div = document.getElementById("severity");
  div.innerHTML = "";

  ["Lehký","Střední","Těžký","Sranda"].forEach(sev => {
    const btn = document.createElement("button");
    btn.innerText = sev;

    if (sev === currentSeverity) btn.classList.add("sev-active");

    btn.onclick = () => {
      currentSeverity = sev;
      buildSeverity();
    };

    div.appendChild(btn);
  });
}

// =========================
// BUTTONS
// =========================

function buildButtons() {
  const container = document.getElementById("buttons");
  container.innerHTML = "";

  if (critData["Útok"]) {
    Object.keys(critData["Útok"]).forEach(type => {
      const btn = document.createElement("button");
      btn.innerText = type;
      btn.onclick = (e) => generate("Útok", type, e.target);
      container.appendChild(btn);
    });
  }

  if (critData["Obrana"]) {
    const btn = document.createElement("button");
    btn.innerText = "Obrana";
    btn.onclick = (e) => generate("Obrana", null, e.target);
    container.appendChild(btn);
  }

  if (critData["Skill"]) {
    Object.keys(critData["Skill"]).forEach(attr => {
      Object.keys(critData["Skill"][attr]).forEach(skill => {
        const btn = document.createElement("button");
        btn.innerText = skill;
        btn.onclick = (e) => generate("Skill", {attr, skill}, e.target);
        container.appendChild(btn);
      });
    });
  }
}

// =========================
// GENERATE
// =========================

window.generate = function(type, sub, btn) {

  let pool;

  if (type === "Útok") pool = critData[type][sub][currentSeverity];
  else if (type === "Obrana") pool = critData[type][currentSeverity];
  else pool = critData[type][sub.attr][sub.skill][currentSeverity];

  if (!pool) return;

  const random = pool[Math.floor(Math.random() * pool.length)];

  lastState = { pool, type, sub };

  currentResult =
    `💥 ${random.effect}\n\n🎭 ${(random.roleplay || []).join(" ")}`;

  if (activeContainer) activeContainer.remove();

  const box = document.createElement("div");
  box.className = "card";

  box.innerHTML = `
    ${currentResult}
    <br><br>
    <button onclick="reroll()">🔄 Generuj znovu</button>
  `;

  btn.parentNode.insertBefore(box, btn.nextSibling);
  activeContainer = box;
}

// =========================
// REROLL
// =========================

window.reroll = function() {
  if (!lastState) return;

  const random = lastState.pool[Math.floor(Math.random() * lastState.pool.length)];

  currentResult =
    `💥 ${random.effect}\n\n🎭 ${(random.roleplay || []).join(" ")}`;

  activeContainer.innerHTML = `
    ${currentResult}
    <br><br>
    <button onclick="reroll()">🔄 Generuj znovu</button>
  `;
}

</script>

</body>
</html>

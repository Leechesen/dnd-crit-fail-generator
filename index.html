<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>KritFailer</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #ffffff;
  color: #111;
}

header {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  background: #f3f3f3;
}

.title {
  color: orange;
  font-weight: bold;
}

.container {
  padding: 12px;
}

input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  padding: 10px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  margin: 4px;
}

.primary { background: orange; color: white; }
.danger { background: #ef4444; color: white; }
.playerBtn { color: white; }

.hidden { display: none; }

.room {
  display: flex;
  justify-content: space-between;
  margin: 5px 0;
  background: #eee;
  padding: 10px;
  border-radius: 8px;
}

.card {
  background: #f5f5f5;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>
  <div class="title">🎲 KritFailer</div>
  <div id="topPlayers"></div>
  <div id="topButtons"></div>
</header>

<div id="setup" class="container">
  <input id="name" placeholder="Jméno">
  <input id="roomName" placeholder="Název místnosti">
  <button class="primary" id="createRoomBtn">Vytvořit místnost</button>

  <h3>Lobby</h3>
  <div id="roomsList"></div>
</div>

<div id="app" class="container hidden">
  <h3 id="roomTitle"></h3>

  <div id="dmPanel" class="hidden">
    <h3>🎲 Generátor failu</h3>
    <button id="rollBtn" class="primary">Hodit fail</button>

    <div id="resultBox" class="card hidden"></div>

    <h3>📤 Poslat hráči</h3>
    <div id="playerTargets"></div>
  </div>

  <div id="playerPanel" class="hidden">
    <h3>Hráči</h3>
    <div id="playersList"></div>

    <h3>📩 Výsledek</h3>
    <div id="result" class="card">Čekám...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, set, get, onValue, remove, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
});

const db = getDatabase(app);

let state = {
  room: "",
  name: "",
  id: "",
  isDM: false,
  players: {},
  lastResult: ""
};

const FAILS = [
  "Upustíš zbraň",
  "Zakopneš a spadneš",
  "Zasáhneš spojence",
  "Zlomíš si zbraň",
  "Ztratíš rovnováhu",
  "Netrefíš vůbec nic",
  "Zraníš sám sebe"
];

const el = {
  setup: document.getElementById("setup"),
  app: document.getElementById("app"),
  roomTitle: document.getElementById("roomTitle"),
  playersList: document.getElementById("playersList"),
  roomsList: document.getElementById("roomsList"),
  dmPanel: document.getElementById("dmPanel"),
  playerPanel: document.getElementById("playerPanel"),
  topPlayers: document.getElementById("topPlayers"),
  topButtons: document.getElementById("topButtons"),
  result: document.getElementById("result"),
  resultBox: document.getElementById("resultBox"),
  playerTargets: document.getElementById("playerTargets")
};

// ===== CREATE ROOM =====
document.getElementById("createRoomBtn").onclick = async () => {
  const name = document.getElementById("name").value.trim();
  const room = document.getElementById("roomName").value.trim();

  if (!name || !room) return alert("Vyplň vše");

  state = {
    room,
    name,
    id: "DM_" + Date.now(),
    isDM: true
  };

  await set(ref(db, "rooms/" + room), {
    dm: state.id,
    players: {
      [state.id]: { name: name + " 👑" }
    }
  });

  save();
  start();
};

// ===== JOIN ROOM =====
window.joinRoom = async (room) => {
  const name = document.getElementById("name").value.trim();
  if (!name) return alert("Zadej jméno");

  const id = "P_" + Date.now();

  await set(ref(db, "rooms/" + room + "/players/" + id), { name });

  state = { room, name, id, isDM: false };

  save();
  start();
};

// ===== LOBBY =====
onValue(ref(db, "rooms"), snap => {
  const data = snap.val() || {};
  let html = "";

  Object.keys(data).forEach(r => {
    html += `
      <div class="room">
        <span>${r}</span>
        <button onclick="joinRoom('${r}')">Join</button>
      </div>`;
  });

  el.roomsList.innerHTML = html;
});

// ===== START =====
function start() {
  el.setup.classList.add("hidden");
  el.app.classList.remove("hidden");

  el.roomTitle.innerText = "Room: " + state.room;

  el.dmPanel.classList.toggle("hidden", !state.isDM);
  el.playerPanel.classList.toggle("hidden", state.isDM);

  el.topButtons.innerHTML = `
    <button onclick="logout()">🚪</button>
    ${state.isDM ? `<button class="danger" onclick="deleteRoom()">🗑️</button>` : ""}
  `;

  onDisconnect(ref(db, "rooms/" + state.room + "/players/" + state.id)).remove();

  listenPlayers();

  if (!state.isDM) {
    onValue(ref(db, "rooms/" + state.room + "/messages/" + state.id), snap => {
      if (snap.val()) {
        el.result.innerText = snap.val();
      }
    });
  }

  document.getElementById("rollBtn")?.addEventListener("click", rollFail);
}

// ===== PLAYERS =====
function listenPlayers() {
  onValue(ref(db, "rooms/" + state.room + "/players"), snap => {
    state.players = snap.val() || {};

    el.topPlayers.innerText = Object.values(state.players).map(p => p.name).join(" | ");

    let html = "";
    let targets = "";

    let i = 1;

    Object.entries(state.players).forEach(([id, p]) => {
      html += `<button class="playerBtn" style="background:${getColor(i)}">${p.name}</button>`;

      if (state.isDM && !id.startsWith("DM_")) {
        targets += `<button onclick="sendTo('${id}')">${p.name}</button>`;
      }

      i++;
    });

    el.playersList.innerHTML = html;
    el.playerTargets.innerHTML = targets;
  });
}

// ===== FAIL =====
function rollFail() {
  const fail = FAILS[Math.floor(Math.random() * FAILS.length)];

  state.lastResult = fail;

  el.resultBox.innerText = fail;
  el.resultBox.classList.remove("hidden");
}

// ===== SEND =====
window.sendTo = async (playerId) => {
  if (!state.lastResult) return alert("Nejdřív hoď fail");

  await set(ref(db, "rooms/" + state.room + "/messages/" + playerId), state.lastResult);
};

// ===== COLORS =====
function getColor(i) {
  const colors = ["#ef4444","#22c55e","#3b82f6","#eab308","#a855f7"];
  return colors[(i-1)%colors.length];
}

// ===== STORAGE =====
function save() {
  localStorage.setItem("room", state.room);
  localStorage.setItem("name", state.name);
  localStorage.setItem("id", state.id);
  localStorage.setItem("isDM", state.isDM);
}

// ===== LOGOUT =====
window.logout = () => {
  localStorage.clear();
  location.reload();
};

// ===== DELETE =====
window.deleteRoom = async () => {
  await remove(ref(db, "rooms/" + state.room));
  localStorage.clear();
  location.reload();
};

// ===== AUTO =====
const savedRoom = localStorage.getItem("room");
if (savedRoom) {
  state = {
    room: savedRoom,
    name: localStorage.getItem("name"),
    id: localStorage.getItem("id"),
    isDM: localStorage.getItem("isDM") === "true"
  };
  start();
}
</script>

</body>
</html>

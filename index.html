<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KritFailer</title>

<style>
body { background:#111; color:white; text-align:center; font-family:Arial; }
h1 { color:#ff9800; }

button {
  padding:10px;
  margin:5px;
  border-radius:10px;
  border:none;
  background:#222;
  color:white;
}

.selected { background:#ff9800; }

.card {
  background:#1a1a1a;
  padding:15px;
  margin:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🎲 KritFailer</h1>

<div id="setup">
  <input id="name" placeholder="Jméno"><br>
  <input id="room" placeholder="Room"><br>
  <button onclick="joinDM()">Jsem DM</button>
  <button onclick="joinPlayer()">Jsem hráč</button>
</div>

<div id="dmPanel" style="display:none;">
  <h2>👑 DM</h2>

  <!-- SEVERITY -->
  <div>
    <button onclick="setSeverity('Lehký')" id="sLehký">Lehký</button>
    <button onclick="setSeverity('Střední')" id="sStřední">Střední</button>
    <button onclick="setSeverity('Těžký')" id="sTěžký">Těžký</button>
    <button onclick="setSeverity('Sranda')" id="sSranda">Sranda</button>
  </div>

  <!-- ACTION -->
  <div>
    <button onclick="generate('Útok')">⚔️ Útok</button>
    <button onclick="generate('Obrana')">🛡️ Obrana</button>
    <button onclick="generate('Skill')">🎲 Skill</button>
  </div>

  <div id="result"></div>
  <div id="players"></div>
</div>

<div id="playerView" style="display:none;">
  <h2>🎭 Hráč</h2>
  <div id="playerResult">Čekám...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, get, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// =========================
// STATE
// =========================

let room = "";
let myId = "";
let players = {};
let currentResult = null;
let severity = "Lehký";
let data = {};

// =========================
// LOAD JSON
// =========================

fetch("crit_fails.json")
.then(res => res.json())
.then(json => {
  data = json;
  console.log("JSON OK");
});

// =========================
// ID
// =========================
function makeId(prefix){
  return prefix + "_" + Date.now() + "_" + Math.floor(Math.random()*1000);
}

// =========================
// SEVERITY
// =========================
window.setSeverity = function(s){

  severity = s;

  ["Lehký","Střední","Těžký","Sranda"].forEach(x=>{
    document.getElementById("s"+x).classList.remove("selected");
  });

  document.getElementById("s"+s).classList.add("selected");
}

// =========================
// DM
// =========================
window.joinDM = async function(){

  room = document.getElementById("room").value;
  const name = document.getElementById("name").value || "DM";

  myId = makeId("DM");

  await set(ref(db,"rooms/"+room),{
    players:{
      [myId]:{ name:name+" 👑" }
    }
  });

  onDisconnect(ref(db,"rooms/"+room+"/players/"+myId)).remove();

  document.getElementById("setup").style.display="none";
  document.getElementById("dmPanel").style.display="block";

  listenPlayers();
}

// =========================
// PLAYER
// =========================
window.joinPlayer = async function(){

  room = document.getElementById("room").value;
  const name = document.getElementById("name").value;

  myId = makeId("P");

  await set(ref(db,"rooms/"+room+"/players/"+myId),{
    name:name
  });

  onDisconnect(ref(db,"rooms/"+room+"/players/"+myId)).remove();

  document.getElementById("setup").style.display="none";
  document.getElementById("playerView").style.display="block";

  listenPlayer();
}

// =========================
// PLAYERS
// =========================
function listenPlayers(){
  onValue(ref(db,"rooms/"+room+"/players"), snap=>{
    players = snap.val() || {};

    let html="<h3>Hráči:</h3>";
    Object.values(players).forEach(p=> html+=p.name+"<br>");

    document.getElementById("players").innerHTML=html;
  });
}

// =========================
// GENERATE
// =========================
window.generate = function(type){

  let pool = [];

  if(type==="Obrana"){
    pool = data["Obrana"][severity] || [];
  }

  if(type==="Útok"){
    Object.values(data["Útok"]).forEach(t=>{
      pool = pool.concat(t[severity] || []);
    });
  }

  if(type==="Skill"){
    Object.values(data["Skill"]).forEach(attr=>{
      Object.values(attr).forEach(skill=>{
        pool = pool.concat(skill[severity] || []);
      });
    });
  }

  if(pool.length===0){
    alert("Žádná data");
    return;
  }

  currentResult = pool[Math.floor(Math.random()*pool.length)];

  render();
}

// =========================
// RENDER
// =========================
function render(){

  let buttons="";

  Object.entries(players).forEach(([id,p])=>{
    if(!p.name.includes("👑")){
      buttons+=`<button onclick="send('${id}')">${p.name}</button>`;
    }
  });

  document.getElementById("result").innerHTML=`
    <div class="card">
      <b>${currentResult.effect}</b><br><br>
      ${currentResult.roleplay.join("<br>")}<br><br>
      <button onclick="generateAgain()">🔄 Znovu</button><br><br>
      ${buttons}
    </div>
  `;
}

// =========================
// REROLL
// =========================
window.generateAgain = function(){
  render();
}

// =========================
// SEND
// =========================
window.send = function(pid){
  set(ref(db,"rooms/"+room+"/msg/"+pid), currentResult);
}

// =========================
// PLAYER VIEW
// =========================
function listenPlayer(){
  onValue(ref(db,"rooms/"+room+"/msg/"+myId), snap=>{
    if(snap.val()){
      document.getElementById("playerResult").innerText = snap.val().effect;
    }
  });
}

</script>

</body>
</html>

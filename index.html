<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KritFailer</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

h1 { color: #ff9800; }

input {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  background: #222;
  color: white;
  cursor: pointer;
}

button:hover { background: #444; }

.room {
  border: 1px solid #333;
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>🎲 KritFailer</h1>

<div id="setup">

  <input id="name" placeholder="Tvoje jméno"><br>

  <h3>Vytvořit místnost</h3>
  <input id="room" placeholder="Room code"><br>
  <input id="password" placeholder="Heslo (volitelné)"><br>

  <button onclick="joinDM()">Vytvořit jako DM</button>

  <h3>Aktivní místnosti</h3>
  <div id="rooms"></div>

</div>

<div id="dmPanel" style="display:none;">
  <h2>👑 DM Panel</h2>
  <button onclick="logout()">Logout</button>
  <div id="players"></div>
</div>

<div id="playerView" style="display:none;">
  <h2>🎭 Hráč</h2>
  <button onclick="logout()">Logout</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue, get, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI3qi2zqosghoQNRQ31hDZU1y_tBioedY",
  databaseURL: "https://ktit-fail-generator-default-rtdb.europe-west1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let room = "";
let myId = "";

// =========================
// SAFE ID (bez tečky)
// =========================
function createId(prefix) {
  return prefix + "_" + Date.now() + "_" + Math.floor(Math.random()*1000);
}

// =========================
// LOAD ROOMS
// =========================
function loadRooms() {
  onValue(ref(db, 'rooms'), (snapshot) => {
    const data = snapshot.val() || {};
    const div = document.getElementById("rooms");
    div.innerHTML = "";

    Object.keys(data).forEach(r => {

      if (!data[r].createdAt) return;

      div.innerHTML += `
        <div class="room">
          ${r}<br>
          <button onclick="joinRoom('${r}')">Připojit</button>
        </div>
      `;
    });
  });
}

loadRooms();

// =========================
// CREATE ROOM (DM)
// =========================
window.joinDM = async function() {

  const name = document.getElementById("name").value || "DM";
  const password = document.getElementById("password").value;
  room = document.getElementById("room").value;

  if (!room) {
    alert("Zadej název místnosti");
    return;
  }

  myId = createId("DM");

  try {

    await set(ref(db, 'rooms/' + room), {
      createdAt: Date.now(),
      password: password || "",
      players: {
        [myId]: {
          name: name + " 👑"
        }
      }
    });

    onDisconnect(ref(db, 'rooms/' + room + '/players/' + myId)).remove();

    document.getElementById("setup").style.display = "none";
    document.getElementById("dmPanel").style.display = "block";

    listenPlayers();

  } catch (e) {
    console.error(e);
    alert("Chyba – F12 console");
  }
}

// =========================
// JOIN PLAYER
// =========================
window.joinRoom = async function(r) {

  const name = document.getElementById("name").value;

  if (!name) {
    alert("Zadej jméno");
    return;
  }

  const snap = await get(ref(db, 'rooms/' + r));
  const data = snap.val();

  if (!data) {
    alert("Room neexistuje");
    return;
  }

  if (data.password) {
    const pass = prompt("Zadej heslo");
    if (pass !== data.password) {
      alert("Špatné heslo");
      return;
    }
  }

  room = r;
  myId = createId("P");

  await set(ref(db, 'rooms/' + room + '/players/' + myId), {
    name: name
  });

  onDisconnect(ref(db, 'rooms/' + room + '/players/' + myId)).remove();

  document.getElementById("setup").style.display = "none";
  document.getElementById("playerView").style.display = "block";
}

// =========================
// PLAYERS LIST
// =========================
function listenPlayers() {
  onValue(ref(db, 'rooms/' + room + '/players'), (snapshot) => {

    const players = snapshot.val() || {};
    const div = document.getElementById("players");

    div.innerHTML = "<h3>Hráči:</h3>";

    Object.values(players).forEach(p => {
      div.innerHTML += p.name + "<br>";
    });
  });
}

// =========================
// LOGOUT
// =========================
window.logout = function() {
  location.reload();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>KritFailer</title>
</head>

<body>

<input id="name" placeholder="Jméno">
<input id="roomName" placeholder="Room">
<button id="createRoomBtn">Vytvořit</button>

<div id="roomsList"></div>

<div id="app" style="display:none">
  <div id="dmPanel" style="display:none">DM PANEL</div>
  <div id="playerPanel" style="display:none">
    <div id="playersList"></div>
    <div id="playerResult"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, set, onValue, get, remove, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey: "xxx",
  databaseURL: "xxx"
});
const db = getDatabase(app);

let state = {
  room: "",
  name: "",
  myId: "",
  isDM: false,
  players: {}
};

// CREATE ROOM
document.getElementById("createRoomBtn").onclick = async () => {
  const name = document.getElementById("name").value;
  const room = document.getElementById("roomName").value;

  if (!name || !room) return alert("Vyplň vše");

  const existing = await get(ref(db, "rooms/" + room));
  if (existing.exists()) return alert("Room existuje");

  state = {
    room,
    name,
    myId: "DM_" + Date.now(),
    isDM: true
  };

  await set(ref(db, "rooms/" + room), {
    players: {
      [state.myId]: { name: name + " 👑" }
    }
  });

  localStorage.setItem("room", room);
  localStorage.setItem("name", name);
  localStorage.setItem("id", state.myId);
  localStorage.setItem("isDM", "true");

  start();
};

// JOIN ROOM
window.joinRoom = async (room) => {
  const name = document.getElementById("name").value;
  if (!name) return alert("Zadej jméno");

  const id = "P_" + Date.now();

  await set(ref(db, "rooms/" + room + "/players/" + id), { name });

  state = { room, name, myId: id, isDM: false };

  localStorage.setItem("room", room);
  localStorage.setItem("name", name);
  localStorage.setItem("id", id);
  localStorage.setItem("isDM", "false");

  start();
};

// ROOM LIST
onValue(ref(db, "rooms"), snap => {
  const data = snap.val() || {};
  let html = "";

  Object.keys(data).forEach(r => {
    html += `<button onclick="joinRoom('${r}')">${r}</button><br>`;
  });

  document.getElementById("roomsList").innerHTML = html;
});

// START
function start() {
  document.getElementById("app").style.display = "block";

  document.getElementById("dmPanel").style.display = state.isDM ? "block" : "none";
  document.getElementById("playerPanel").style.display = state.isDM ? "none" : "block";

  onDisconnect(ref(db, "rooms/" + state.room + "/players/" + state.myId)).remove();

  onValue(ref(db, "rooms/" + state.room + "/players"), snap => {
    const players = snap.val() || {};
    let html = "";

    Object.values(players).forEach(p => {
      html += `<div>${p.name}</div>`;
    });

    document.getElementById("playersList").innerHTML = html;
  });
}

// AUTO RECONNECT
const savedRoom = localStorage.getItem("room");
if (savedRoom) {
  state = {
    room: savedRoom,
    name: localStorage.getItem("name"),
    myId: localStorage.getItem("id"),
    isDM: localStorage.getItem("isDM") === "true"
  };
  start();
}
</script>

</body>
</html>
